<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WordClimb</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f1ea;
    --ink: #1f2a37;
    --muted: #5b6675;
    --card: #ffffff;
    --line: #e3dccf;
    --navy: #22314d;
    --navy-2: #2f4369;
    --sun: #ee7f1c;
    --sun-soft: #fde6cf;
    --teal: #0f8476;
    --teal-soft: #d4efea;
    --red: #cf3f3f;
    --red-soft: #fbe1e1;
    --gold: #f2b705;
    --violet: #5f4fc9;
    --violet-soft: #e6e2fb;
    --radius: 16px;
    --shadow: 0 2px 0 rgba(34,49,77,.08), 0 8px 24px rgba(34,49,77,.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px; line-height: 1.5;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
  h1 { font-size: 2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
  p { margin: 0 0 .8em; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  /* Top bar */
  #top {
    position: sticky; top: 0; z-index: 50;
    background: var(--navy); color: #fff;
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: .01em; margin-right: auto; background: none; border: 0; color: #fff; padding: 4px 0; }
  .brand span { color: var(--gold); }
  .pill {
    background: var(--navy-2); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 6px 12px; font-size: .85rem; white-space: nowrap;
  }
  .pill:hover { background: #3a5180; }
  .pill.on { background: var(--teal); border-color: var(--teal); }
  .pill.key { background: var(--sun); border-color: var(--sun); font-weight: 600; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600;
    background: var(--navy); color: #fff; min-height: 48px;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); transition: transform .05s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sun { background: var(--sun); }
  .btn.teal { background: var(--teal); }
  .btn.violet { background: var(--violet); }
  .btn.ghost { background: transparent; color: var(--navy); box-shadow: none; border: 2px solid var(--line); }
  .btn.small { min-height: 38px; padding: 6px 14px; font-size: .9rem; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  .speak {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    min-width: 48px; min-height: 48px; font-size: 1.2rem; padding: 4px 10px;
  }
  .speak:hover { border-color: var(--teal); }

  .field {
    width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px;
    background: #fff; font-size: 1.15rem; outline: none;
  }
  .field:focus { border-color: var(--teal); }
  .code-field { text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }

  /* Start */
  .hero { text-align: center; padding: 26px 8px 8px; }
  .hero h1 { font-size: 2.4rem; }
  .hero .mtn { font-size: 3rem; }
  .levelpick { border: 3px solid var(--line); border-radius: var(--radius); background: #fff; padding: 16px; text-align: left; width: 100%; }
  .levelpick.sel { border-color: var(--teal); background: var(--teal-soft); }
  .levelpick .ic { font-size: 2rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px; font-weight: 600; }
  .tab.sel { background: var(--navy); color: #fff; border-color: var(--navy); }
  .err { color: var(--red); font-weight: 600; min-height: 1.5em; }

  /* Home trail */
  .week {
    position: relative; text-align: left; border: 2px solid var(--line); background: #fff;
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); width: 100%;
  }
  .week:hover { border-color: var(--sun); }
  .week .num { font-size: .8rem; font-weight: 700; color: var(--sun); text-transform: uppercase; letter-spacing: .08em; }
  .week h3 { margin: 4px 0 2px; }
  .week .done { position: absolute; top: 12px; right: 14px; font-size: 1.4rem; }
  .stars { color: var(--gold); letter-spacing: 2px; white-space: nowrap; }
  .stars .off { color: #d8d1c3; }
  .meter { height: 10px; background: #eee6d8; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; background: linear-gradient(90deg, var(--teal), #2bb3a0); border-radius: 99px; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--sun-soft); color: #9a4b07; }
  .tag.g { background: var(--violet-soft); color: var(--violet); }
  .tag.w { background: var(--teal-soft); color: var(--teal); }

  .act {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .act:hover { border-color: var(--teal); }
  .act .ic { font-size: 1.8rem; width: 44px; text-align: center; }
  .act .t { font-weight: 600; }
  .tip { background: var(--violet-soft); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .tip.s { background: var(--sun-soft); }
  .ex { font-size: .95rem; margin: 4px 0 0; }

  .wordlist { display: flex; flex-wrap: wrap; gap: 8px; }
  .wl { border: 2px solid var(--line); border-radius: 10px; background: #fff; padding: 6px 12px; font-weight: 500; }
  .wl b { color: var(--sun); }

  /* Activities */
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .progress .meter { flex: 1; margin: 0; }
  .big-q { font-size: 1.35rem; font-weight: 600; margin: 8px 0 14px; }
  .sentence-card { background: #fbf9f5; border: 2px dashed var(--line); border-radius: 14px; padding: 16px; font-size: 1.3rem; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .sentence-card .txt { flex: 1; }
  .opts { display: grid; gap: 10px; }
  .opt-row { display: flex; gap: 8px; }
  .opt {
    flex: 1; text-align: left; border: 2px solid var(--line); border-radius: 12px; background: #fff;
    padding: 14px 16px; font-size: 1.1rem; min-height: 54px;
  }
  .opt:hover:not(:disabled) { border-color: var(--navy); }
  .opt.right { background: var(--teal-soft); border-color: var(--teal); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); opacity: .75; }
  .feedback { min-height: 2em; font-weight: 600; margin: 12px 0; }
  .feedback.good { color: var(--teal); }
  .feedback.bad { color: var(--red); }
  .hint-word { font-size: 2rem; letter-spacing: .3em; font-weight: 700; color: var(--navy); }
  .hint-word b { color: var(--sun); }

  .chunkword { font-size: 2.6rem; font-weight: 700; letter-spacing: .06em; text-align: center; margin: 10px 0 20px; }
  .chunkword .blank { display: inline-block; min-width: 1.6em; border-bottom: 5px solid var(--sun); color: var(--sun); margin: 0 3px; }

  .buckets { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 18px; }
  .bucket { border: 3px dashed var(--line); border-radius: 14px; background: #fff; padding: 12px; min-height: 120px; text-align: left; }
  .bucket.ready { border-color: var(--teal); border-style: solid; }
  .bucket h4 { margin: 0 0 8px; font-size: 1rem; }
  .bucket .in { display: flex; flex-wrap: wrap; gap: 6px; }
  .bucket .in span { background: var(--teal-soft); border-radius: 8px; padding: 3px 8px; font-size: .95rem; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 16px; font-size: 1.1rem; font-weight: 500;
  }
  .chip:hover { border-color: var(--navy); }
  .chip.sel { background: var(--navy); color: #fff; border-color: var(--navy); }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .split { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .split .w { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 1.2rem; }
  .split .w.subj { background: #dbe7fb; border-color: #8aa8dd; }
  .split .w.pred { background: var(--sun-soft); border-color: var(--sun); }
  .split .w.wrong { background: var(--red-soft); border-color: var(--red); }

  /* Result */
  .result { text-align: center; }
  .result .bigstars { font-size: 3.2rem; color: var(--gold); letter-spacing: 6px; }
  .result .bigstars .off { color: #e1d9c9; }
  .codebox { background: var(--navy); color: #fff; border-radius: 14px; padding: 16px; margin: 16px 0; text-align: center; }
  .codebox .code { font-size: 1.7rem; font-weight: 700; letter-spacing: .1em; word-break: break-all; margin: 6px 0 10px; color: var(--gold); }

  /* Writing */
  .frame { border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 16px; margin-bottom: 10px; font-size: 1.2rem; line-height: 2.1; }
  .frame.active { border-color: var(--teal); }
  .frame .n { font-size: .8rem; font-weight: 700; color: var(--muted); margin-right: 6px; }
  .blank-btn {
    border: 0; border-bottom: 3px solid var(--sun); background: var(--sun-soft); border-radius: 6px 6px 0 0;
    padding: 0 10px; font-size: 1.1rem; color: #9a4b07; font-weight: 500; line-height: 1.7;
  }
  .blank-btn.filled { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }
  .blank-btn.on { outline: 3px solid var(--teal); }
  .ref { background: var(--violet-soft); padding: 0 8px; border-radius: 6px; }
  .blank-in {
    border: 0; border-bottom: 3px solid var(--sun); background: var(--sun-soft); border-radius: 6px 6px 0 0;
    padding: 2px 8px; font-size: 1.1rem; min-width: 8ch; max-width: 100%; outline: none;
  }
  .blank-in:focus { border-color: var(--teal); background: var(--teal-soft); }
  .tray { background: #fbf9f5; border-radius: 12px; padding: 12px; margin-top: 8px; line-height: 1.4; }
  .tray .pool { justify-content: flex-start; }
  .tray .chip { font-size: 1rem; padding: 8px 12px; text-align: left; }
  .preview { background: #fffdf8; border: 2px solid var(--sun); border-radius: 14px; padding: 16px; font-size: 1.15rem; }
  .preview .gap { color: #b9ae9a; }
  textarea.write { width: 100%; min-height: 260px; padding: 16px; border: 2px solid var(--line); border-radius: 14px; font-size: 1.15rem; line-height: 1.7; resize: vertical; outline: none; }
  textarea.write:focus { border-color: var(--teal); }
  .check { list-style: none; padding: 0; margin: 0; }
  .check li { padding: 4px 0; }
  .steps { display: flex; gap: 6px; }
  .steps i { width: 14px; height: 14px; border-radius: 50%; background: #e1d9c9; display: inline-block; }
  .steps i.on { background: var(--teal); }

  /* Modal + toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,28,45,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; }

  table.t { width: 100%; border-collapse: collapse; font-size: .85rem; background: #fff; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; white-space: nowrap; }
  table.t th { background: var(--navy); color: #fff; position: sticky; top: 0; }
  table.t td:first-child { text-align: left; font-weight: 600; }
  .scroll-x { overflow-x: auto; }

  /* ---------- Color + engagement layer ---------- */
  body { background: linear-gradient(180deg, #ffeedd 0, var(--bg) 360px) no-repeat, var(--bg); }
  .band { border-radius: var(--radius); padding: 14px 18px; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .band.spell { background: linear-gradient(135deg, #f8a53c, #e5541b); }
  .band.gram  { background: linear-gradient(135deg, #9a7bff, #5a3fc4); }
  .band.write { background: linear-gradient(135deg, #2fd0b3, #0c7c6f); }
  .band .big { font-size: 2rem; line-height: 1; }
  .band .ttl { font-weight: 700; font-size: 1.15rem; flex: 1; }
  .band .btn.ghost { color: #fff; border-color: rgba(255,255,255,.5); }
  .band .meter { background: rgba(255,255,255,.35); }
  .band .meter > div { background: #fff; }
  .togo { font-weight: 700; white-space: nowrap; }
  .streak { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.25); border-radius: 99px; padding: 4px 12px; font-weight: 700; }
  .streak.hot { background: linear-gradient(90deg, #ffd23c, #ff6a3c); color: #3a1500; animation: pop .4s; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .bump { display: inline-block; animation: pop .5s; }
  .confetti { position: fixed; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 300; animation: conf 1.1s ease-out forwards; }
  @keyframes conf { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

  .map-card { background: linear-gradient(180deg, #7fcbff 0%, #c7ecff 55%, #fff4e2 100%); border-radius: 22px; padding: 8px; margin-bottom: 18px; border: 2px solid #fff; box-shadow: var(--shadow); }
  .map-card svg { width: 100%; height: auto; display: block; }
  .camp { cursor: pointer; }
  .camp:hover circle.ring { stroke-width: 7; }
  .climber { animation: bob 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  .week { border-top: 8px solid var(--c, var(--sun)); }
  .week .num { color: var(--c, var(--sun)); }
  .week .meter > div { background: var(--c, var(--teal)); }
  .week:hover { border-color: var(--c, var(--sun)); background: color-mix(in srgb, var(--c, #fff) 7%, #fff); }

  .goal { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #fff6cf, #ffe2a8); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; }
  .goal .e { font-size: 2.4rem; }
  .goal .meter { background: rgba(255,255,255,.7); }
  .goal .meter > div { background: linear-gradient(90deg, #ffb703, #fb8500); }
  .gear { display: flex; flex-wrap: wrap; gap: 10px; }
  .gear .g { width: 74px; text-align: center; font-size: .72rem; font-weight: 600; }
  .gear .g .e { font-size: 1.9rem; display: block; background: #fff; border-radius: 14px; padding: 8px 0; border: 2px solid var(--line); margin-bottom: 3px; }
  .gear .g.have .e { border-color: var(--gold); background: #fffbe9; }
  .gear .g.lock .e { filter: grayscale(1); opacity: .3; }
  .unlock { background: linear-gradient(135deg, #fff3c4, #ffd27a); border-radius: 14px; padding: 14px; margin: 12px 0; font-weight: 600; font-size: 1.1rem; }
  .unlock .e { font-size: 2.6rem; display: block; animation: pop .6s; }

  .avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
  .av { font-size: 2rem; border: 3px solid var(--line); border-radius: 14px; background: #fff; padding: 6px 0; line-height: 1.2; }
  .av.sel { border-color: var(--teal); background: var(--teal-soft); transform: scale(1.06); }
  .toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .toggle-row .lbl { flex: 1; }
  .switch { width: 58px; height: 32px; border-radius: 99px; background: #d9d2c4; border: 0; position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch.on { background: var(--teal); }
  .switch.on::after { left: 30px; }

  .starpop span { display: inline-block; animation: starIn .55s both; }
  .starpop span:nth-child(2) { animation-delay: .2s; }
  .starpop span:nth-child(3) { animation-delay: .4s; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-120deg); } 70% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }

  .bucket:nth-child(6n+1) { --bc: #ef5b3f; } .bucket:nth-child(6n+2) { --bc: #2f86e0; } .bucket:nth-child(6n+3) { --bc: #2fae5b; }
  .bucket:nth-child(6n+4) { --bc: #8a4fd8; } .bucket:nth-child(6n+5) { --bc: #e2468f; } .bucket:nth-child(6n+6) { --bc: #f29d16; }
  .bucket { border-color: color-mix(in srgb, var(--bc) 45%, #fff); background: color-mix(in srgb, var(--bc) 7%, #fff); }
  .bucket h4 { color: var(--bc); }
  .bucket.ready { border-color: var(--bc); }
  .bucket .in span { background: color-mix(in srgb, var(--bc) 18%, #fff); }
  .chunkchip:nth-child(4n+1) { border-color: #f6a23a; } .chunkchip:nth-child(4n+2) { border-color: #2f86e0; }
  .chunkchip:nth-child(4n+3) { border-color: #2fae5b; } .chunkchip:nth-child(4n+4) { border-color: #e2468f; }

  .frame.r-topic { border-left: 10px solid #2fae5b; }
  .frame.r-key { border-left: 10px solid #f2b705; }
  .frame.r-ex { border-left: 10px solid #e5484d; }
  .role { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-right: 6px; vertical-align: middle; line-height: 1.6; }
  .role.r-topic { background: #d9f5e1; color: #1d7a3e; } .role.r-key { background: #fff2c2; color: #8a6500; } .role.r-ex { background: #ffdcdc; color: #b42328; }
  .preview .s-topic { background: #d9f5e1; } .preview .s-key { background: #fff2c2; } .preview .s-ex { background: #ffdcdc; }
  .preview span[class^="s-"] { border-radius: 4px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  body.calm { background: #f2f1ee; }
  body.calm #app { filter: saturate(.45); }
  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  body.calm .map-card { background: #e9eef1; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 24px; font-size: 14pt; line-height: 2; }
  }
  @media (max-width: 560px) {
    body { font-size: 17px; }
    .hero h1 { font-size: 1.9rem; }
    .chunkword { font-size: 2rem; }
    .pill { padding: 5px 9px; font-size: .78rem; }
  }
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<div id="toast"></div>
<div class="print-area" id="printArea"></div>

<script>
/* =========================================================
   WordClimb: spelling, grammar, and writing practice
   Progress is saved in a "save code" so it works on shared
   devices with no server, no login, and no API.
   ========================================================= */

/* ---------------- LEVELS ---------------- */

/* ---------------- SAVE CODE ----------------
   Slots (2 bits each, value 0-3):
   week w: spelling acts at w*5+0..2, grammar acts at w*5+3..4  (6 weeks = 30 slots)
   writing types at 30..32 (value = steps completed)
*/
const WEEKS = 6, SLOTS = 33, CODE_VERSION = 2;
/* v2 header: version(3) level(2) avatar(4) prefs(4: read, slow, sound, calm). v1 codes had no avatar/prefs. */
const PREF_KEYS = ['read', 'slow', 'sound', 'calm'];
function defaultPrefs() {
  let calm = false;
  try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  return { read: false, slow: false, sound: true, calm };
}
const AB = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const spellSlot = (w, a) => w * 5 + a;
const gramSlot = (w, a) => w * 5 + 3 + a;
const writeSlot = t => 30 + t;

function fnv(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const bitsOf = (n, len) => n.toString(2).padStart(len, '0');

function encodeCode(st) {
  let bits = bitsOf(CODE_VERSION, 3) + bitsOf(st.level - 1, 2) + bitsOf(st.avatar || 0, 4)
    + PREF_KEYS.map(k => st.prefs[k] ? '1' : '0').join('') + st.prog.map(v => bitsOf(v, 2)).join('');
  while (bits.length % 5) bits += '0';
  let data = '';
  for (let i = 0; i < bits.length; i += 5) data += AB[parseInt(bits.slice(i, i + 5), 2)];
  data = data.replace(/2+$/, '');
  const c = fnv(st.name + '|' + data) % 1024;
  data += AB[c >> 5] + AB[c & 31];
  return st.name + '-' + data.match(/.{1,4}/g).join('-');
}

function decodeCode(raw) {
  const s = String(raw || '').toUpperCase().replace(/\s+/g, '');
  const i = s.indexOf('-');
  if (i < 1) throw new Error('Your code starts with your name and a dash, like MARIA-7K2P.');
  const name = s.slice(0, i).replace(/[^A-Z]/g, '');
  const data = s.slice(i + 1).replace(/-/g, '');
  if (!name) throw new Error('Your code starts with your name and a dash, like MARIA-7K2P.');
  if (/[01IO]/.test(data)) throw new Error('Codes never use the letters I or O or the numbers 0 or 1. Double check it.');
  if (data.length < 3 || /[^A-Z2-9]/.test(data)) throw new Error('That code does not look right. Double check each letter.');
  const body = data.slice(0, -2), chk = data.slice(-2);
  const c = fnv(name + '|' + body) % 1024;
  if (AB[c >> 5] + AB[c & 31] !== chk) throw new Error('That code does not match. Check each letter and number carefully.');
  let bits = '';
  for (const ch of body) bits += bitsOf(AB.indexOf(ch), 5);
  bits = bits.padEnd(3 + 2 + 4 + 4 + SLOTS * 2, '0');
  const ver = parseInt(bits.slice(0, 3), 2);
  if (ver !== 1 && ver !== 2) throw new Error('That code is from a different version of WordClimb.');
  const level = parseInt(bits.slice(3, 5), 2) + 1;
  if (level > 3) throw new Error('That code does not look right.');
  let avatar = 0, prefs = defaultPrefs(), p = 5;
  if (ver === 2) {
    avatar = parseInt(bits.slice(5, 9), 2);
    prefs = {}; PREF_KEYS.forEach((k, i) => prefs[k] = bits[9 + i] === '1');
    p = 13;
  }
  const prog = [];
  for (let k = 0; k < SLOTS; k++) prog.push(parseInt(bits.slice(p + k * 2, p + 2 + k * 2), 2));
  return { name, level, avatar, prefs, prog };
}

/* ---------------- SOUND FX (synthesized, no files) ---------------- */
let actx = null;
function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, actx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
}
function sfx(kind) {
  if (!settings.sound || settings.calm) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (kind === 'good') { tone(660, 0, .12, 'triangle'); tone(990, .09, .18, 'triangle'); }
    else if (kind === 'streak') { [660, 830, 990, 1320].forEach((f, i) => tone(f, i * .06, .14, 'triangle', .15)); }
    else if (kind === 'bad') { tone(220, 0, .18, 'sine', .12); }
    else if (kind === 'finish') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle')); tone(1047, .5, .5, 'sine', .12); }
    else if (kind === 'gear') { [1175, 1568, 1976, 2349].forEach((f, i) => tone(f, i * .07, .25, 'sine', .1)); }
    else if (kind === 'tap') { tone(520, 0, .06, 'sine', .08); }
  } catch (e) {}
}

function confetti(x, y, n = 16, power = 160) {
  if (settings.calm) return;
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    const ang = Math.random() * Math.PI * 2, d = power * (0.4 + Math.random() * 0.8);
    c.style.cssText = `left:${x}px;top:${y}px;background:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]};--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d + 80}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}
function confettiFrom(el, n, power) {
  if (!el) return confetti(innerWidth / 2, innerHeight / 3, n, power);
  const r = el.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, n, power);
}
function bigConfetti() {

function parseWord(str, wk) {
  const [raw, cat, sentence] = str.split('|');
  const parts = [], chunks = [];
  const re = /\[([^\]]+)\]/g; let last = 0, m;
  while ((m = re.exec(raw))) {
    if (m.index > last) parts.push({ t: raw.slice(last, m.index) });
    parts.push({ b: m[1] }); chunks.push(m[1]); last = re.lastIndex;
  }
  if (last < raw.length) parts.push({ t: raw.slice(last) });
  return { word: raw.replace(/[\[\]]/g, ''), parts, chunk: chunks.join('_'), cat: +cat, sentence, wk };
}
function weekWords(w) {
  if (w < 5) return SPELL[w].words[S.level].map(s => parseWord(s, w));
  let out = [];
  for (let k = 0; k < 5; k++) out = out.concat(shuffle(SPELL[k].words[S.level]).slice(0, 2).map(s => parseWord(s, k)));
  return shuffle(out);
}
function wordHTML(wd) { return wd.parts.map(p => p.b ? `<b>${esc(p.b)}</b>` : esc(p.t)).join(''); }

function checkSpell() {
  const inp = $('#spellIn'), fb = $('#fb');
  const val = inp.value.trim().toLowerCase();
  if (!val) return;
  const wd = ACT.items[ACT.idx];
  if (val === wd.word.toLowerCase()) {

      <li>${/[.!?]["']?\s*$/.test(ta.value.trim()) ? '✅' : '⬜'} Ends with punctuation</li>`;
    $('#finishFree').disabled = !(st.sentences >= needS && st.words >= needW);
  };
  ta.addEventListener('input', upd); upd();
}

function finishWriting(text) {
  const slot = writeSlot(WS.t), step = WS.step + 1;
  const improved = step > S.prog[slot], totalBefore = totalStars();
  if (improved) { S.prog[slot] = step; persist(); }
  renderTop(); if (improved) bumpStars();
  const gearHTML = gearUnlockHTML(totalBefore, totalStars());
  sfx('finish'); bigConfetti();
  $('#printArea').innerHTML = `<h2>${esc(cap(S.name.toLowerCase()))}: ${esc(WRITING[WS.t].name)} Paragraph</h2><p>${esc(text)}</p>`;
  WS.finalText = text;
  render(`
    <div class="card result" style="max-width:720px;margin:20px auto">
      <div style="font-size:3rem">${AVATARS[S.avatar || 0]}</div>
      <h1>🎉 Paragraph complete!</h1>${gearHTML}
      <div class="preview" style="text-align:left;margin:16px 0">${esc(text)}</div>
      <div class="row" style="justify-content:center;margin-bottom:10px">
        <button class="btn ghost" data-act="sayFinal">🔊 Read it to me</button>
        <button class="btn teal" data-act="copyPara">📋 Copy paragraph</button>
        <button class="btn ghost" data-act="printPara">🖨️ Print</button>
      </div>
      <p class="small muted">Your paragraph is not saved in your code, so paste it into Google Classroom or a Doc to keep it!</p>
      ${improved ? `<div class="codebox"><div class="small">✨ STEP ${step} UNLOCKED! YOUR NEW CODE:</div><div class="code">${esc(encodeCode(S))}</div>
        <button class="btn sun" data-act="copyCode">📋 Copy my code</button></div>` : ''}
      <div class="row" style="justify-content:center">
        <button class="btn ghost" data-act="backSteps">Back to steps</button>
        <button class="btn sun" data-act="goHome">Trail home</button>
      </div>
    </div>`);
}

/* ---------------- TEACHER VIEW ---------------- */
function renderTeacher() {
  S = null; settings = defaultPrefs(); applyCalm(); renderTop();
  render(`
    <button class="btn ghost small" data-act="goStart">← Back</button>
    <h1 style="margin-top:12px">👩‍🏫 Teacher View</h1>
    <p class="muted">Paste student codes below, one per line (or separated by spaces or commas). You will see each student's progress. Nothing is sent anywhere.</p>
    <textarea class="write" id="tcodes" style="min-height:140px" placeholder="MARIA-7K2P-Q9XM&#10;JAYDEN-4MRT-..."></textarea>
    <div class="row" style="margin:10px 0 18px"><button class="btn sun" data-act="teacherRun">Show progress</button><button class="btn ghost" data-act="teacherCSV" id="csvBtn" disabled>📋 Copy as spreadsheet</button></div>
    <div id="tout"></div>
    <div class="card" style="margin-top:20px"><h3>How the stars work</h3>
      <p class="small">Each activity earns 1 to 3 stars: 1 for finishing, 2 for 70% or better on the first try, 3 for 90% or better. Each week has 15 stars (3 spelling activities and 2 grammar activities). Writing shows steps completed (Build It, Boost It, Write It) for each type.</p>
      <p class="small">Codes are checked, so a student who changes a letter will get an error instead of fake stars. Codes are not a password though, so a determined kid could share one.</p></div>`);
}
let teacherRows = [];
function teacherRun() {
  const raw = $('#tcodes').value.split(/[\n,;]+|\s{2,}|\s(?=[A-Za-z]+-)/).map(s => s.trim()).filter(Boolean);
  teacherRows = raw.map(c => { try { return Object.assign({ ok: true, code: c }, decodeCode(c)); } catch (e) { return { ok: false, code: c, err: e.message }; } });
  const wk = st => Array.from({ length: WEEKS }, (_, w) => {
    let s = 0, g = 0; for (let a = 0; a < 3; a++) s += st.prog[spellSlot(w, a)]; for (let a = 0; a < 2; a++) g += st.prog[gramSlot(w, a)];
    return { s, g };
  });
  $('#tout').innerHTML = teacherRows.length ? `<div class="scroll-x"><table class="t"><thead><tr><th>Student</th><th>Trail</th>
    ${Array.from({ length: WEEKS }, (_, w) => `<th>Wk ${w + 1}<br><span class="small">Spell / Gram</span></th>`).join('')}
    ${WRITING.map(t => `<th>${t.name}</th>`).join('')}<th>Total ★</th></tr></thead><tbody>
    ${teacherRows.map(r => r.ok ? `<tr><td>${AVATARS[r.avatar || 0]} ${esc(r.name)}</td><td>${LEVELS[r.level].name}</td>
      ${wk(r).map(x => `<td>${x.s}/9 · ${x.g}/6</td>`).join('')}
      ${WRITING.map((_, t) => `<td>${r.prog[writeSlot(t)]}/3</td>`).join('')}<td><b>${totalStars(r)}</b></td></tr>`
      : `<tr><td colspan="${3 + WEEKS + WRITING.length}" style="text-align:left;color:var(--red)">${esc(r.code)}: ${esc(r.err)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">No codes found.</p>';
  $('#csvBtn').disabled = !teacherRows.some(r => r.ok);
}
function teacherCSV() {
  const head = ['Student', 'Trail'];
  for (let w = 0; w < WEEKS; w++) head.push(`Wk${w + 1} Spelling`, `Wk${w + 1} Grammar`);
  WRITING.forEach(t => head.push(t.name)); head.push('Total Stars');
  const lines = [head.join('\t')];
  teacherRows.filter(r => r.ok).forEach(r => {
    const row = [r.name, LEVELS[r.level].name];
    for (let w = 0; w < WEEKS; w++) {
      let s = 0, g = 0; for (let a = 0; a < 3; a++) s += r.prog[spellSlot(w, a)]; for (let a = 0; a < 2; a++) g += r.prog[gramSlot(w, a)];
      row.push(s, g);
    }
    WRITING.forEach((_, t) => row.push(r.prog[writeSlot(t)])); row.push(totalStars(r));
    lines.push(row.join('\t'));
  });
  copyText(lines.join('\n')).then(ok => toast(ok ? 'Copied! Paste into Google Sheets.' : 'Copy failed. Try again.'));
}

/* ---------------- ACTIONS (click router) ---------------- */
const ACTIONS = {
  goStart: () => { if (S && !codeCopied && !confirm('Did you copy your newest code? Your new stars are only saved in the code.')) return; try { sessionStorage.removeItem('wc_session'); } catch (e) {} renderStart(); },
  goHome: () => S ? renderHome() : renderStart(),
  startTab: d => { startTab = d.t; renderStart(); },
  pickNewLevel: d => { newLevel = +d.l; const nm = $('#nm').value; renderStart(); $('#nm').value = nm; },
  startNew: () => {
    const name = ($('#nm').value || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 12);
    if (name.length < 2) { $('#err').textContent = 'Type your first name (letters only).'; return; }
    useStudent({ name, level: newLevel, avatar: newAvatar, prefs: defaultPrefs(), prog: new Array(SLOTS).fill(0) });
    persist(); renderHome(); codeModal(true);
  },
  loadCode: () => {
    try { useStudent(decodeCode($('#cd').value)); codeCopied = true; try { sessionStorage.setItem('wc_session', encodeCode(S)); } catch (e) {} renderHome(); toast('Welcome back, ' + cap(S.name.toLowerCase()) + '!'); }
    catch (e) { $('#err').textContent = e.message; }
  },
  teacher: () => renderTeacher(),
  teacherRun: () => teacherRun(),
  teacherCSV: () => teacherCSV(),
  codeModal: () => codeModal(false),
  settingsModal: () => settingsModal(),
  togglePref: d => {
    settings[d.k] = !settings[d.k]; saveSettings(); applyCalm(); renderTop(); settingsModal();
    if (d.k === 'sound' && settings.sound) sfx('good');
    if (d.k === 'slow') speak(settings.slow ? 'Slow voice on.' : 'Normal voice.');
  },
  toggleCalm: () => { settings.calm = !settings.calm; saveSettings(); applyCalm(); renderTop(); toast(settings.calm ? '🌙 Calm Mode on. Take your time.' : 'Calm Mode off.'); },
  setAvatar: d => { S.avatar = +d.i; saveSettings(); renderTop(); settingsModal(); if (!ACT && !WS) renderHome(); },
  pickNewAvatar: d => { newAvatar = +d.i; const nm = $('#nm').value; renderStart(); $('#nm').value = nm; },
  closeModal: () => closeModal(),
  setLevel: d => { const l = +d.l; closeModal(); if (l !== S.level) { S.level = l; persist(); toast('Trail switched to ' + LEVELS[l].name + '. Your code changed!'); } renderHome(); },
  copyCode: () => copyText(encodeCode(S)).then(ok => { if (ok) { codeCopied = true; toast('Code copied! Paste it somewhere safe.'); } else toast('Could not copy. Write it down instead.'); }),
  logout: () => {
    if (!codeCopied && !confirm('Did you save your newest code? Click OK if you have it.')) return;
    closeModal(); try { sessionStorage.removeItem('wc_session'); } catch (e) {} codeCopied = true; startTab = 'code'; renderStart('See you next time! 👋');
    $('#err').style.color = 'var(--teal)';
  },
  say: d => speak(d.text),
  openWeek: d => renderWeek(+d.w),
  startSpell: d => startSpell(+d.w, +d.a),
  startGram: d => startGram(+d.w, +d.a),
  quitAct: () => renderWeek(ACT.w),
  retryAct: () => ACT.kind === 'spell' ? startSpell(ACT.w, ACT.a) : startGram(ACT.w, ACT.a),
  sayWord: () => speak(ACT.items[ACT.idx].word),
  sayWordSlow: () => speak(ACT.items[ACT.idx].word, 0.5),
  saySentence: () => { const wd = ACT.items[ACT.idx]; speak(`${wd.word}. ${wd.sentence} ${wd.word}.`); },
  checkSpell: () => checkSpell(),
  pickWord: d => { ACT.sel = +d.i; renderSort(); speak(ACT.items[ACT.sel].word); },
  dropWord: (d, el) => dropWord(+d.b, el),
  pickChunk: (d, el) => pickChunk(d.o, el),
  pickOpt: (d, el) => { const i = +d.i, q = ACT.items[ACT.idx]; if (settings.read) speak(q.options[i]); answerGram(isRight(q, i), i, el); },
  pickSplit: (d, el) => { const i = +d.i, q = ACT.items[ACT.idx]; answerGram(i === q.answerIndex, i, el); },
  nextQ: () => { ACT.idx++; ACT.wrong = []; ACT.solved = false; renderGram(); },
  openWriting: d => renderWritingTopic(+d.t),
  pickTopic: d => { WS.topic = +d.i; if (WRITING[WS.t].topics[WS.topic].sides) renderSidePick(); else renderStepPick(); },
  pickSide: d => { WS.side = +d.i; renderStepPick(); },
  pickStep: d => { WS.step = +d.i; if (WS.step === 2) { WS.free = ''; renderFree(); } else startBuilder(); },
  backSteps: () => renderStepPick(),
  openBlank: d => { WS.active = WS.active === d.k ? null : d.k; renderBuilder(); },
  ideaTray: d => { WS.active = WS.active === d.k ? null : d.k; renderBuilder(); },
  pickChip: d => {
    const c = chipsFor(d.k)[+d.i]; WS.vals[d.k] = c; sfx('tap');
    if (settings.read) speak(c);
    WS.active = WS.step === 0 ? nextEmpty(d.k) : null;
    renderBuilder();
  },
  useOwn: d => { const v = ($('#ownIn').value || '').trim(); if (!v) return; WS.vals[d.k] = v; WS.active = nextEmpty(d.k); renderBuilder(); },
  sayFrame: d => speak(sentenceOf(wFrames()[+d.f], false)),
  sayPara: () => speak(paragraphText()),
  finishWrite: () => { if (allFilled()) finishWriting(paragraphText()); },
  insertText: d => {
    const ta = $('#freeTa'); const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
    let txt = d.text; const before = ta.value.slice(0, s);
    if (before && !/\s$/.test(before)) txt = ' ' + txt;
    ta.value = before + txt + ta.value.slice(e); ta.focus();
    ta.selectionStart = ta.selectionEnd = s + txt.length;
    ta.dispatchEvent(new Event('input'));
    if (settings.read) speak(d.text);
  },
  sayFree: () => speak($('#freeTa').value),
  finishFree: () => finishWriting($('#freeTa').value.trim()),
  sayFinal: () => speak(WS.finalText),
  copyPara: () => copyText(WS.finalText).then(ok => toast(ok ? 'Paragraph copied!' : 'Could not copy.')),
  printPara: () => window.print()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', e => {
  if (S && !codeCopied) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------------- BOOT ---------------- */
(function boot() {
  let saved = null;
  try { saved = sessionStorage.getItem('wc_session'); } catch (e) {}
  if (saved) { try { useStudent(decodeCode(saved)); codeCopied = true; return renderHome(); } catch (e) {} }
  renderStart();
})();
</script>
</body>
</html>
