<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WordClimb</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f1ea;
    --ink: #1f2a37;
    --muted: #5b6675;
    --card: #ffffff;
    --line: #e3dccf;
    --navy: #22314d;
    --navy-2: #2f4369;
    --sun: #ee7f1c;
    --sun-soft: #fde6cf;
    --teal: #0f8476;
    --teal-soft: #d4efea;
    --red: #cf3f3f;
    --red-soft: #fbe1e1;
    --gold: #f2b705;
    --violet: #5f4fc9;
    --violet-soft: #e6e2fb;
    --radius: 16px;
    --shadow: 0 2px 0 rgba(34,49,77,.08), 0 8px 24px rgba(34,49,77,.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px; line-height: 1.5;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
  h1 { font-size: 2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
  p { margin: 0 0 .8em; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  /* Top bar */
  #top {
    position: sticky; top: 0; z-index: 50;
    background: var(--navy); color: #fff;
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: .01em; margin-right: auto; background: none; border: 0; color: #fff; padding: 4px 0; }
  .brand span { color: var(--gold); }
  .pill {
    background: var(--navy-2); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 6px 12px; font-size: .85rem; white-space: nowrap;
  }
  .pill:hover { background: #3a5180; }
  .pill.on { background: var(--teal); border-color: var(--teal); }
  .pill.key { background: var(--sun); border-color: var(--sun); font-weight: 600; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600;
    background: var(--navy); color: #fff; min-height: 48px;
    box-shadow: 0 3px 0 rgba(0,0,0,.18); transition: transform .05s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sun { background: var(--sun); }
  .btn.teal { background: var(--teal); }
  .btn.violet { background: var(--violet); }
  .btn.ghost { background: transparent; color: var(--navy); box-shadow: none; border: 2px solid var(--line); }
  .btn.small { min-height: 38px; padding: 6px 14px; font-size: .9rem; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  .speak {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    min-width: 48px; min-height: 48px; font-size: 1.2rem; padding: 4px 10px;
  }
  .speak:hover { border-color: var(--teal); }

  .field {
    width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px;
    background: #fff; font-size: 1.15rem; outline: none;
  }
  .field:focus { border-color: var(--teal); }
  .code-field { text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }

  /* Start */
  .hero { text-align: center; padding: 26px 8px 8px; }
  .hero h1 { font-size: 2.4rem; }
  .hero .mtn { font-size: 3rem; }
  .levelpick { border: 3px solid var(--line); border-radius: var(--radius); background: #fff; padding: 16px; text-align: left; width: 100%; }
  .levelpick.sel { border-color: var(--teal); background: var(--teal-soft); }
  .levelpick .ic { font-size: 2rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px; font-weight: 600; }
  .tab.sel { background: var(--navy); color: #fff; border-color: var(--navy); }
  .err { color: var(--red); font-weight: 600; min-height: 1.5em; }

  /* Home trail */
  .week {
    position: relative; text-align: left; border: 2px solid var(--line); background: #fff;
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); width: 100%;
  }
  .week:hover { border-color: var(--sun); }
  .week .num { font-size: .8rem; font-weight: 700; color: var(--sun); text-transform: uppercase; letter-spacing: .08em; }
  .week h3 { margin: 4px 0 2px; }
  .week .done { position: absolute; top: 12px; right: 14px; font-size: 1.4rem; }
  .stars { color: var(--gold); letter-spacing: 2px; white-space: nowrap; }
  .stars .off { color: #d8d1c3; }
  .meter { height: 10px; background: #eee6d8; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; background: linear-gradient(90deg, var(--teal), #2bb3a0); border-radius: 99px; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--sun-soft); color: #9a4b07; }
  .tag.g { background: var(--violet-soft); color: var(--violet); }
  .tag.w { background: var(--teal-soft); color: var(--teal); }

  .act {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .act:hover { border-color: var(--teal); }
  .act .ic { font-size: 1.8rem; width: 44px; text-align: center; }
  .act .t { font-weight: 600; }
  .tip { background: var(--violet-soft); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .tip.s { background: var(--sun-soft); }
  .ex { font-size: .95rem; margin: 4px 0 0; }

  .wordlist { display: flex; flex-wrap: wrap; gap: 8px; }
  .wl { border: 2px solid var(--line); border-radius: 10px; background: #fff; padding: 6px 12px; font-weight: 500; }
  .wl b { color: var(--sun); }

  /* Activities */
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .progress .meter { flex: 1; margin: 0; }
  .big-q { font-size: 1.35rem; font-weight: 600; margin: 8px 0 14px; }
  .sentence-card { background: #fbf9f5; border: 2px dashed var(--line); border-radius: 14px; padding: 16px; font-size: 1.3rem; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .sentence-card .txt { flex: 1; }
  .opts { display: grid; gap: 10px; }
  .opt-row { display: flex; gap: 8px; }
  .opt {
    flex: 1; text-align: left; border: 2px solid var(--line); border-radius: 12px; background: #fff;
    padding: 14px 16px; font-size: 1.1rem; min-height: 54px;
  }
  .opt:hover:not(:disabled) { border-color: var(--navy); }
  .opt.right { background: var(--teal-soft); border-color: var(--teal); }
  .opt.wrong { background: var(--red-soft); border-color: var(--red); opacity: .75; }
  .feedback { min-height: 2em; font-weight: 600; margin: 12px 0; }
  .feedback.good { color: var(--teal); }
  .feedback.bad { color: var(--red); }
  .hint-word { font-size: 2rem; letter-spacing: .3em; font-weight: 700; color: var(--navy); }
  .hint-word b { color: var(--sun); }

  .chunkword { font-size: 2.6rem; font-weight: 700; letter-spacing: .06em; text-align: center; margin: 10px 0 20px; }
  .chunkword .blank { display: inline-block; min-width: 1.6em; border-bottom: 5px solid var(--sun); color: var(--sun); margin: 0 3px; }

  .buckets { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 18px; }
  .bucket { border: 3px dashed var(--line); border-radius: 14px; background: #fff; padding: 12px; min-height: 120px; text-align: left; }
  .bucket.ready { border-color: var(--teal); border-style: solid; }
  .bucket h4 { margin: 0 0 8px; font-size: 1rem; }
  .bucket .in { display: flex; flex-wrap: wrap; gap: 6px; }
  .bucket .in span { background: var(--teal-soft); border-radius: 8px; padding: 3px 8px; font-size: .95rem; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 16px; font-size: 1.1rem; font-weight: 500;
  }
  .chip:hover { border-color: var(--navy); }
  .chip.sel { background: var(--navy); color: #fff; border-color: var(--navy); }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .split { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .split .w { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 1.2rem; }
  .split .w.subj { background: #dbe7fb; border-color: #8aa8dd; }
  .split .w.pred { background: var(--sun-soft); border-color: var(--sun); }
  .split .w.wrong { background: var(--red-soft); border-color: var(--red); }

  /* Result */
  .result { text-align: center; }
  .result .bigstars { font-size: 3.2rem; color: var(--gold); letter-spacing: 6px; }
  .result .bigstars .off { color: #e1d9c9; }
  .codebox { background: var(--navy); color: #fff; border-radius: 14px; padding: 16px; margin: 16px 0; text-align: center; }
  .codebox .code { font-size: 1.7rem; font-weight: 700; letter-spacing: .1em; word-break: break-all; margin: 6px 0 10px; color: var(--gold); }

  /* Writing */
  .frame { border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 16px; margin-bottom: 10px; font-size: 1.2rem; line-height: 2.1; }
  .frame.active { border-color: var(--teal); }
  .frame .n { font-size: .8rem; font-weight: 700; color: var(--muted); margin-right: 6px; }
  .blank-btn {
    border: 0; border-bottom: 3px solid var(--sun); background: var(--sun-soft); border-radius: 6px 6px 0 0;
    padding: 0 10px; font-size: 1.1rem; color: #9a4b07; font-weight: 500; line-height: 1.7;
  }
  .blank-btn.filled { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }
  .blank-btn.on { outline: 3px solid var(--teal); }
  .ref { background: var(--violet-soft); padding: 0 8px; border-radius: 6px; }
  .blank-in {
    border: 0; border-bottom: 3px solid var(--sun); background: var(--sun-soft); border-radius: 6px 6px 0 0;
    padding: 2px 8px; font-size: 1.1rem; min-width: 8ch; max-width: 100%; outline: none;
  }
  .blank-in:focus { border-color: var(--teal); background: var(--teal-soft); }
  .tray { background: #fbf9f5; border-radius: 12px; padding: 12px; margin-top: 8px; line-height: 1.4; }
  .tray .pool { justify-content: flex-start; }
  .tray .chip { font-size: 1rem; padding: 8px 12px; text-align: left; }
  .preview { background: #fffdf8; border: 2px solid var(--sun); border-radius: 14px; padding: 16px; font-size: 1.15rem; }
  .preview .gap { color: #b9ae9a; }
  textarea.write { width: 100%; min-height: 260px; padding: 16px; border: 2px solid var(--line); border-radius: 14px; font-size: 1.15rem; line-height: 1.7; resize: vertical; outline: none; }
  textarea.write:focus { border-color: var(--teal); }
  .check { list-style: none; padding: 0; margin: 0; }
  .check li { padding: 4px 0; }
  .steps { display: flex; gap: 6px; }
  .steps i { width: 14px; height: 14px; border-radius: 50%; background: #e1d9c9; display: inline-block; }
  .steps i.on { background: var(--teal); }

  /* Modal + toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,28,45,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; }

  table.t { width: 100%; border-collapse: collapse; font-size: .85rem; background: #fff; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; white-space: nowrap; }
  table.t th { background: var(--navy); color: #fff; position: sticky; top: 0; }
  table.t td:first-child { text-align: left; font-weight: 600; }
  .scroll-x { overflow-x: auto; }

  /* ---------- Color + engagement layer ---------- */
  body { background: linear-gradient(180deg, #ffeedd 0, var(--bg) 360px) no-repeat, var(--bg); }
  .band { border-radius: var(--radius); padding: 14px 18px; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .band.spell { background: linear-gradient(135deg, #f8a53c, #e5541b); }
  .band.gram  { background: linear-gradient(135deg, #9a7bff, #5a3fc4); }
  .band.write { background: linear-gradient(135deg, #2fd0b3, #0c7c6f); }
  .band .big { font-size: 2rem; line-height: 1; }
  .band .ttl { font-weight: 700; font-size: 1.15rem; flex: 1; }
  .band .btn.ghost { color: #fff; border-color: rgba(255,255,255,.5); }
  .band .meter { background: rgba(255,255,255,.35); }
  .band .meter > div { background: #fff; }
  .togo { font-weight: 700; white-space: nowrap; }
  .streak { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.25); border-radius: 99px; padding: 4px 12px; font-weight: 700; }
  .streak.hot { background: linear-gradient(90deg, #ffd23c, #ff6a3c); color: #3a1500; animation: pop .4s; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .bump { display: inline-block; animation: pop .5s; }
  .confetti { position: fixed; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 300; animation: conf 1.1s ease-out forwards; }
  @keyframes conf { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

  .map-card { background: linear-gradient(180deg, #7fcbff 0%, #c7ecff 55%, #fff4e2 100%); border-radius: 22px; padding: 8px; margin-bottom: 18px; border: 2px solid #fff; box-shadow: var(--shadow); }
  .map-card svg { width: 100%; height: auto; display: block; }
  .camp { cursor: pointer; }
  .camp:hover circle.ring { stroke-width: 7; }
  .climber { animation: bob 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  .week { border-top: 8px solid var(--c, var(--sun)); }
  .week .num { color: var(--c, var(--sun)); }
  .week .meter > div { background: var(--c, var(--teal)); }
  .week:hover { border-color: var(--c, var(--sun)); background: color-mix(in srgb, var(--c, #fff) 7%, #fff); }

  .goal { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #fff6cf, #ffe2a8); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; }
  .goal .e { font-size: 2.4rem; }
  .goal .meter { background: rgba(255,255,255,.7); }
  .goal .meter > div { background: linear-gradient(90deg, #ffb703, #fb8500); }
  .gear { display: flex; flex-wrap: wrap; gap: 10px; }
  .gear .g { width: 74px; text-align: center; font-size: .72rem; font-weight: 600; }
  .gear .g .e { font-size: 1.9rem; display: block; background: #fff; border-radius: 14px; padding: 8px 0; border: 2px solid var(--line); margin-bottom: 3px; }
  .gear .g.have .e { border-color: var(--gold); background: #fffbe9; }
  .gear .g.lock .e { filter: grayscale(1); opacity: .3; }
  .unlock { background: linear-gradient(135deg, #fff3c4, #ffd27a); border-radius: 14px; padding: 14px; margin: 12px 0; font-weight: 600; font-size: 1.1rem; }
  .unlock .e { font-size: 2.6rem; display: block; animation: pop .6s; }

  .avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
  .av { font-size: 2rem; border: 3px solid var(--line); border-radius: 14px; background: #fff; padding: 6px 0; line-height: 1.2; }
  .av.sel { border-color: var(--teal); background: var(--teal-soft); transform: scale(1.06); }
  .toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .toggle-row .lbl { flex: 1; }
  .switch { width: 58px; height: 32px; border-radius: 99px; background: #d9d2c4; border: 0; position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch.on { background: var(--teal); }
  .switch.on::after { left: 30px; }

  .starpop span { display: inline-block; animation: starIn .55s both; }
  .starpop span:nth-child(2) { animation-delay: .2s; }
  .starpop span:nth-child(3) { animation-delay: .4s; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-120deg); } 70% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }

  .bucket:nth-child(6n+1) { --bc: #ef5b3f; } .bucket:nth-child(6n+2) { --bc: #2f86e0; } .bucket:nth-child(6n+3) { --bc: #2fae5b; }
  .bucket:nth-child(6n+4) { --bc: #8a4fd8; } .bucket:nth-child(6n+5) { --bc: #e2468f; } .bucket:nth-child(6n+6) { --bc: #f29d16; }
  .bucket { border-color: color-mix(in srgb, var(--bc) 45%, #fff); background: color-mix(in srgb, var(--bc) 7%, #fff); }
  .bucket h4 { color: var(--bc); }
  .bucket.ready { border-color: var(--bc); }
  .bucket .in span { background: color-mix(in srgb, var(--bc) 18%, #fff); }
  .chunkchip:nth-child(4n+1) { border-color: #f6a23a; } .chunkchip:nth-child(4n+2) { border-color: #2f86e0; }
  .chunkchip:nth-child(4n+3) { border-color: #2fae5b; } .chunkchip:nth-child(4n+4) { border-color: #e2468f; }

  .frame.r-topic { border-left: 10px solid #2fae5b; }
  .frame.r-key { border-left: 10px solid #f2b705; }
  .frame.r-ex { border-left: 10px solid #e5484d; }
  .role { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-right: 6px; vertical-align: middle; line-height: 1.6; }
  .role.r-topic { background: #d9f5e1; color: #1d7a3e; } .role.r-key { background: #fff2c2; color: #8a6500; } .role.r-ex { background: #ffdcdc; color: #b42328; }
  .preview .s-topic { background: #d9f5e1; } .preview .s-key { background: #fff2c2; } .preview .s-ex { background: #ffdcdc; }
  .preview span[class^="s-"] { border-radius: 4px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  body.calm { background: #f2f1ee; }
  body.calm #app { filter: saturate(.45); }
  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  body.calm .map-card { background: #e9eef1; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 24px; font-size: 14pt; line-height: 2; }
    .print-area.doc { font-size: 11pt; line-height: 1.45; padding: 0; color: #000; }
    .pdoc h1 { font-size: 18pt; margin: 0 0 4pt; } .pdoc h2 { font-size: 14pt; margin: 14pt 0 6pt; border-bottom: 1.5pt solid #000; }
    .pdoc .sub { font-size: 10pt; margin-bottom: 8pt; }
    .pdoc .page { page-break-after: always; } .pdoc .page:last-child { page-break-after: auto; }
    .pdoc ol { columns: 2; column-gap: 28pt; margin: 0; padding-left: 22pt; } .pdoc ol li { margin: 3pt 0; break-inside: avoid; }
    .pdoc ol.one { columns: 1; }
    .pdoc .trails { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14pt; } .pdoc .trails ol { columns: 1; }
    .pdoc .line { border-bottom: 1pt solid #000; display: inline-block; width: 85%; height: 1.4em; }

/* ---------------- SAVE CODE ----------------
   Each unit has 30 slots (2 bits each, value 0-3 stars):
   week w: spelling acts at w*5+0..2, grammar acts at w*5+3..4  (6 weeks incl. review)
   Writing: 3 slots (steps completed per writing type), shared across units.

   v3 layout (sparse, so codes stay short even with a whole year of progress):
     version(3) level(2) avatar(4) prefs(4) currentUnit(3) writing(3x2)
     then per unit: 1 bit "has progress"; if set, per week: 1 bit "has progress";
       if set: 1 bit "all 3 stars" (mastered) or 0 followed by 5x2 bits of stars.
   v1 and v2 codes (one unit, flat) still load.
*/
const NUM_UNITS = 6, WEEKS = 6, UNIT_SLOTS = 30, CODE_VERSION = 4, BEE_MAX = 127;
const PREF_KEYS = ['read', 'slow', 'sound', 'calm'];
function defaultPrefs() {
  let calm = false;
  try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  return { read: false, slow: false, sound: true, calm };
}
const AB = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const spellSlot = (w, a) => w * 5 + a;
const gramSlot = (w, a) => w * 5 + 3 + a;
const emptyUnits = () => Array.from({ length: NUM_UNITS }, () => new Array(UNIT_SLOTS).fill(0));
function newStudent(name, level, avatar) {
  return { name, level, avatar, prefs: defaultPrefs(), unit: 0, u: emptyUnits(), w: [0, 0, 0], bee: 0 };
}

function fnv(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const bitsOf = (n, len) => n.toString(2).padStart(len, '0');

function encodeCode(st) {
  let bits = bitsOf(CODE_VERSION, 3) + bitsOf(st.level - 1, 2) + bitsOf(st.avatar || 0, 4)
    + PREF_KEYS.map(k => st.prefs[k] ? '1' : '0').join('') + bitsOf(st.unit || 0, 3)
    + st.w.map(v => bitsOf(v, 2)).join('') + bitsOf(Math.min(st.bee || 0, BEE_MAX), 7);
  for (let u = 0; u < NUM_UNITS; u++) {
    const arr = st.u[u];
    if (!arr.some(v => v)) { bits += '0'; continue; }
    bits += '1';
    for (let w = 0; w < WEEKS; w++) {
      const wk = arr.slice(w * 5, w * 5 + 5);
      if (!wk.some(v => v)) { bits += '0'; continue; }
      bits += '1';
      bits += wk.every(v => v === 3) ? '1' : '0' + wk.map(v => bitsOf(v, 2)).join('');
    }
  }
  while (bits.length % 5) bits += '0';
  let data = '';
  for (let i = 0; i < bits.length; i += 5) data += AB[parseInt(bits.slice(i, i + 5), 2)];
  data = data.replace(/2+$/, '');
  const c = fnv(st.name + '|' + data) % 1024;
  data += AB[c >> 5] + AB[c & 31];
  return st.name + '-' + data.match(/.{1,4}/g).join('-');
}

function decodeCode(raw) {
  const s = String(raw || '').toUpperCase().replace(/\s+/g, '');
  const i = s.indexOf('-');
  if (i < 1) throw new Error('Your code starts with your name and a dash, like MARIA-7K2P.');
  const name = s.slice(0, i).replace(/[^A-Z]/g, '');
  const data = s.slice(i + 1).replace(/-/g, '');
  if (!name) throw new Error('Your code starts with your name and a dash, like MARIA-7K2P.');
  if (/[01IO]/.test(data)) throw new Error('Codes never use the letters I or O or the numbers 0 or 1. Double check it.');
  if (data.length < 3 || /[^A-Z2-9]/.test(data)) throw new Error('That code does not look right. Double check each letter.');
  const body = data.slice(0, -2), chk = data.slice(-2);
  const c = fnv(name + '|' + body) % 1024;
  if (AB[c >> 5] + AB[c & 31] !== chk) throw new Error('That code does not match. Check each letter and number carefully.');
  let bits = '';
  for (const ch of body) bits += bitsOf(AB.indexOf(ch), 5);
  let p = 0;
  const read = n => { const seg = bits.slice(p, p + n).padEnd(n, '0'); p += n; return parseInt(seg, 2); };
  const ver = read(3);
  if (ver < 1 || ver > 4) throw new Error('That code is from a different version of WordClimb.');
  const level = read(2) + 1;
  if (level > 3) throw new Error('That code does not look right.');
  const st = newStudent(name, level, 0);
  if (ver >= 2) { st.avatar = read(4); PREF_KEYS.forEach(k => st.prefs[k] = read(1) === 1); }
  if (ver <= 2) {
    // Older codes: one unit stored flat (30 slots), then 3 writing slots.
    for (let k = 0; k < 30; k++) st.u[0][k] = read(2);
    for (let t = 0; t < 3; t++) st.w[t] = read(2);
    return st;
  }
  st.unit = Math.min(read(3), NUM_UNITS - 1);
  for (let t = 0; t < 3; t++) st.w[t] = read(2);
  if (ver >= 4) st.bee = read(7);
  for (let u = 0; u < NUM_UNITS; u++) {
    if (!read(1)) continue;
    for (let w = 0; w < WEEKS; w++) {
      if (!read(1)) continue;
      const mastered = read(1);
      for (let a = 0; a < 5; a++) st.u[u][w * 5 + a] = mastered ? 3 : read(2);
    }
  }
  return st;
}

/* ---------------- SPEECH ---------------- */
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Natural/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastSpoken = '';
function stopSpeech() { if ('speechSynthesis' in window) speechSynthesis.cancel(); lastSpoken = ''; }
function speak(text, rate) {
  if (!('speechSynthesis' in window) || !text) return;
  // Tapping the same 🔊 again while it is still talking stops it.
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if (busy && text === lastSpoken) return stopSpeech();
  speechSynthesis.cancel();
  lastSpoken = text;
  const u = new SpeechSynthesisUtterance(text.replace(/_+/g, 'blank'));
  u.onend = () => { if (lastSpoken === text) lastSpoken = ''; };
  if (voice) u.voice = voice;
  u.rate = rate || (settings.slow ? 0.7 : 0.95);
  speechSynthesis.speak(u);
}

/* ---------------- SOUND FX (synthesized, no files) ---------------- */
let actx = null;
function tone(freq, start, dur, type = 'sine', vol = 0.18) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, actx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
}
function sfx(kind) {
  if (!settings.sound || settings.calm) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (kind === 'good') { tone(660, 0, .12, 'triangle'); tone(990, .09, .18, 'triangle'); }
    else if (kind === 'streak') { [660, 830, 990, 1320].forEach((f, i) => tone(f, i * .06, .14, 'triangle', .15)); }
    else if (kind === 'bad') { tone(220, 0, .18, 'sine', .12); }
    else if (kind === 'finish') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle')); tone(1047, .5, .5, 'sine', .12); }
    else if (kind === 'gear') { [1175, 1568, 1976, 2349].forEach((f, i) => tone(f, i * .07, .25, 'sine', .1)); }
    else if (kind === 'tap') { tone(520, 0, .06, 'sine', .08); }
  } catch (e) {}
}

/* ---------------- CONFETTI + CELEBRATIONS ---------------- */
function confetti(x, y, n = 16, power = 160) {
  if (settings.calm) return;
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    const ang = Math.random() * Math.PI * 2, d = power * (0.4 + Math.random() * 0.8);
    c.style.cssText = `left:${x}px;top:${y}px;background:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]};--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d + 80}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}
function confettiFrom(el, n, power) {
  if (!el) return confetti(innerWidth / 2, innerHeight / 3, n, power);
  const r = el.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, n, power);
}
function bigConfetti() {
  if (settings.calm) return;
  [0, 250, 500].forEach(t => setTimeout(() => {
    confetti(innerWidth * 0.25, innerHeight * 0.3, 30, 260);
    confetti(innerWidth * 0.75, innerHeight * 0.3, 30, 260);
  }, t));
}
const STREAK_CHEERS = { 3: '🔥 3 in a row!', 5: '🔥 5 in a row! On fire!', 8: '🚀 8 in a row! Unstoppable!', 10: '🏆 10 in a row! Legend!' };
// Call on every answer. firstTry=false means they needed a retry, which resets the streak.
function hit(el, firstTry) {
  if (firstTry) ACT.streak++; else ACT.streak = 0;
  ACT.best = Math.max(ACT.best || 0, ACT.streak);
  if (STREAK_CHEERS[ACT.streak]) { sfx('streak'); toast(STREAK_CHEERS[ACT.streak]); confettiFrom(el, 30, 220); }
  else { sfx('good'); confettiFrom(el, firstTry ? 16 : 8); }
}
function miss() { ACT.streak = 0; sfx('bad'); }

}

const JOIN_OPTS = ['🔗 One word', '␣ Space', '➖ Hyphen'];
const JOIN_HINT = ['(one word)', '(two words)', '(with hyphens)'];
function parseWord(str, wk, u = S.unit) {
  const [raw, cat, sentence, alts] = str.split('|');
  const mode = UNITS[u].spell[wk].mode;
  if (mode === 'join') {
    const segs = raw.split(/[+ \-]/);
    return { word: raw.replace(/\+/g, ''), parts: [{ t: raw.replace(/\+/g, '') }], join: true, segs,
      chunk: JOIN_OPTS[+cat], cat: +cat, sentence, wk };
  }
  if (mode === 'syll') {
    // "fac·tor": kids pick where the syllables split. Wrong choices shift the first split by one letter.
    const syls = raw.split('·'), word = syls.join(''), cut = syls[0].length;
    const at = c => word.slice(0, c) + '·' + word.slice(c);
    const alts = [cut - 1, cut + 1, cut + 2, cut - 2].filter(c => c > 0 && c < word.length).slice(0, 2).map(at);
    const parts = []; syls.forEach((sy, i) => { if (i) parts.push({ b: '·' }); parts.push({ t: sy }); });
    return { word, parts, syll: true, chunk: syls.join('·'), cat: +cat, sentence, wk, alts };
  }
  const parts = [], chunks = [];
  const re = /\[([^\]]+)\]/g; let last = 0, m;
  while ((m = re.exec(raw))) {
    if (m.index > last) parts.push({ t: raw.slice(last, m.index) });
    parts.push({ b: m[1] }); chunks.push(m[1]); last = re.lastIndex;
  }
  if (last < raw.length) parts.push({ t: raw.slice(last) });
  return { word: raw.replace(/[\[\]]/g, ''), parts, chunk: chunks.join('_'), cat: +cat, sentence, wk,
    alts: alts ? alts.split(',') : null, homo: mode === 'homo' };
}
// Every word for the week (study list). A round uses a random ROUND_SIZE of them, so replays feel fresh.
const allWeekWords = (w, u = S.unit, lvl = S.level) => UNITS[u].spell[w].words[lvl].map(s => parseWord(s, w, u));

  for (let k = 0; k < 5; k++) out = out.concat(shuffle(allWeekWords(k)).slice(0, 2));
  return shuffle(out);
}

/* Listen & Spell */
function renderListen() {
  if (ACT.idx >= ACT.items.length) return finishActivity(ACT.score / ACT.items.length);
  const wd = ACT.items[ACT.idx];
  render(`${actHeader()}
    <div class="card" style="text-align:center">
      <p class="big-q">Listen, then spell the word.</p>
      <div class="row" style="justify-content:center;margin-bottom:16px">
        <button class="btn teal" data-act="sayWord">🔊 Hear word</button>
        <button class="btn ghost" data-act="sayWordSlow">🐢 Slow</button>
        <button class="btn ghost" data-act="saySentence">📖 In a sentence</button>
      </div>
      <div id="hint" style="min-height:3rem">${ACT.tries === 1 ? hintHTML(wd) : ''}${ACT.revealed ? `<div class="hint-word">${wordHTML(wd)}</div><p class="muted">Type it once to lock it in.</p>` : ''}</div>
      <input id="spellIn" class="field" style="max-width:420px;text-align:center;font-size:1.5rem" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here" />
      <div class="feedback" id="fb"></div>
      <button class="btn sun" data-act="checkSpell">Check ✓</button>
    </div>`);
  const inp = $('#spellIn'); inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ACTIONS.checkSpell(); });
  if (ACT.tries === 0 && !ACT.revealed) setTimeout(() => speak(wd.word), 250);
}
// For homophones the sentence is the clue: show it with the word blanked out.
function blankSentence(wd, fill) {
  const i = wd.sentence.toLowerCase().indexOf(wd.word.toLowerCase());
  if (i < 0) return esc(wd.sentence);
  return esc(wd.sentence.slice(0, i)) + fill + esc(wd.sentence.slice(i + wd.word.length));
}
function hintHTML(wd) {
  if (wd.homo) return `<div style="font-size:1.3rem;margin-bottom:6px">${blankSentence(wd, `<b>${'_ '.repeat(wd.word.length).trim()}</b>`)}</div><p class="muted small">Hint: read the sentence. Which meaning fits?</p>`;
  if (wd.join) {
    const sep = ['', ' ', '-'][wd.cat];
    return `<div class="hint-word">${wd.segs.map(s => '_'.repeat(s.length)).join(sep === ' ' ? '&nbsp;&nbsp;' : sep)}</div><p class="muted small">Hint: ${wd.segs.length} parts ${JOIN_HINT[wd.cat]}</p>`;
  }
  return `<div class="hint-word">${wd.parts.map(p => p.b ? `<b>${esc(p.b)}</b>` : p.t.split('').map(() => '_').join('')).join('')}</div><p class="muted small">Hint: the pattern letters are showing.</p>`;
}
function checkSpell() {
  const inp = $('#spellIn'), fb = $('#fb');
  const val = normSpell(inp.value);
  if (!val) return;
  const wd = ACT.items[ACT.idx];
  if (val === normSpell(wd.word)) {
    if (!ACT.revealed) ACT.score += ACT.tries === 0 ? 1 : 0.5;
    hit(inp, ACT.tries === 0 && !ACT.revealed);
    fb.className = 'feedback good'; fb.textContent = ['Nailed it! ✓', 'Yes! ✓', 'Perfect! ✓'][Math.floor(Math.random() * 3)];
    inp.disabled = true;
    setTimeout(() => { ACT.idx++; ACT.tries = 0; ACT.revealed = false; renderListen(); }, 800);
  } else if (ACT.revealed) {
    sfx('bad'); fb.className = 'feedback bad'; fb.textContent = 'Almost. Copy the word shown above.'; inp.select();
  } else if (ACT.tries === 0) {
    miss(); ACT.tries = 1; renderListen(); $('#fb').className = 'feedback bad'; $('#fb').textContent = 'Not quite. Here is a hint. Try again!';
  } else {
    miss(); ACT.revealed = true; renderListen(); $('#fb').className = 'feedback bad'; $('#fb').textContent = 'Here is the word. You got this.'; speak(wd.word);
  }
}

/* Pattern Sort */
function sortBuckets() {
  if (ACT.w < 5) return USP()[ACT.w].cats.map((c, i) => ({ id: i, label: c.label }));
  return USP().map((s, i) => ({ id: i, label: s.short }));
}
const bucketOf = wd => ACT.w < 5 ? wd.cat : wd.wk;
function renderSort() {
  const left = ACT.items.filter((_, i) => !ACT.placed[i]).length;
  ACT.idx = ACT.items.length - left;
  if (left === 0) return finishActivity(Math.max(0, (ACT.items.length - ACT.mistakes) / ACT.items.length));
  const B = sortBuckets();
  render(`${actHeader()}
    <div class="card">
      <p class="big-q">Tap a word to hear it, then tap the bucket where it belongs.</p>
      <div class="buckets">${B.map(b => `<button class="bucket ${ACT.sel !== null ? 'ready' : ''}" data-act="dropWord" data-b="${b.id}">
        <h4>${esc(b.label)}</h4><div class="in">${ACT.items.map((wd, i) => ACT.placed[i] && bucketOf(wd) === b.id ? `<span>${esc(wd.word)}</span>` : '').join('')}</div></button>`).join('')}</div>
      <div class="pool">${ACT.items.map((wd, i) => ACT.placed[i] ? '' : `<button class="chip ${ACT.sel === i ? 'sel' : ''}" data-act="pickWord" data-i="${i}">${esc(wd.word)}</button>`).join('')}</div>
      <div class="feedback" id="fb" style="text-align:center"></div>
    </div>`);
}
function dropWord(b, el) {
  if (ACT.sel === null) { toast('Tap a word first!'); return; }
  const wd = ACT.items[ACT.sel];
  if (bucketOf(wd) === b) { hit(el, !ACT.lastWrong); ACT.lastWrong = false; ACT.placed[ACT.sel] = true; ACT.sel = null; renderSort(); }
  else {
    miss(); ACT.lastWrong = true; ACT.mistakes++; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    const fb = $('#fb'); fb.className = 'feedback bad'; fb.textContent = 'Not that one. Look and listen again.';
    speak(wd.word, 0.75);
  }
}

/* Missing Piece */
function chunkOptions(wd) {
  if (wd.join) return JOIN_OPTS.slice();
  if (wd.alts) return shuffle([wd.chunk, ...wd.alts]);  // also covers syllable splits
  const wk = USP()[wd.wk];
  const same = wk.cats[wd.cat].chunks.filter(c => c !== wd.chunk);
  const all = [...new Set(wk.cats.flatMap(c => c.chunks))].filter(c => c !== wd.chunk && !same.includes(c));
  const pool = [...new Set([...shuffle(same), ...shuffle(all)])].slice(0, 3);
  return shuffle([wd.chunk, ...pool]);
}
const chunkLabel = o => o.replace(/_/g, ' … ');
function renderChunk() {
  if (ACT.idx >= ACT.items.length) return finishActivity(ACT.score / ACT.items.length);
  const wd = ACT.items[ACT.idx];
  if (!ACT.opts) { ACT.opts = chunkOptions(wd); ACT.wrong = []; ACT.solved = false; }
  const shown = wd.homo ? `<div style="font-size:1.5rem;font-weight:500;letter-spacing:0;line-height:1.6">${blankSentence(wd, `<span class="blank">${ACT.solved ? esc(wd.word) : '?'}</span>`)}</div>`
    : wd.syll ? esc(ACT.solved ? wd.chunk : wd.word) : wd.join
    ? (ACT.solved ? esc(wd.word) : wd.segs.map(esc).join('<span class="blank">?</span>'))
    : wd.parts.map(p => p.b ? `<span class="blank">${ACT.solved ? esc(p.b) : '?'}</span>` : esc(p.t)).join('');
  render(`${actHeader()}
    <div class="card" style="text-align:center">
      <p class="big-q">${wd.homo ? 'Which spelling fits the sentence?' : wd.syll ? 'Where do the syllables split?' : wd.join ? 'How do these parts join together?' : 'Which letters finish the word?'}</p>
      <div class="row" style="justify-content:center"><button class="btn teal" data-act="sayWord">🔊 Hear word</button><button class="btn ghost" data-act="saySentence">📖 In a sentence</button></div>
      <div class="chunkword">${shown}</div>
      <div class="pool">${ACT.opts.map((o, i) => `<button class="chip chunkchip ${ACT.wrong.includes(o) ? 'shake' : ''}" style="font-size:1.4rem;min-width:80px;${ACT.wrong.includes(o) ? 'opacity:.35' : ''}" data-act="pickChunk" data-i="${i}" ${ACT.wrong.includes(o) || ACT.solved ? 'disabled' : ''}>${esc(chunkLabel(o))}</button>`).join('')}</div>
      <div class="feedback ${ACT.solved ? 'good' : ''}" id="fb">${ACT.solved ? 'Yes! ✓' : ACT.wrong.length ? '<span style="color:var(--red)">Try another one.</span>' : ''}</div>
    </div>`);
  if (!ACT.solved && ACT.wrong.length === 0) setTimeout(() => speak(wd.word), 250);
}
function pickChunk(i, el) {
  const wd = ACT.items[ACT.idx], o = ACT.opts[i];
  if (o === wd.chunk) {
    hit(el, ACT.wrong.length === 0);
    if (ACT.wrong.length === 0) ACT.score++;
    ACT.solved = true; renderChunk(); speak(wd.word);
    setTimeout(() => { ACT.idx++; ACT.opts = null; renderChunk(); }, 1100);
  } else { miss(); ACT.wrong.push(o); renderChunk(); }
}

/* ---------------- GRAMMAR ACTIVITIES ---------------- */
const GRAM_ROUND = 8;
function makeQs(w, a, lvl, u = S.unit) {
  const G = UNITS[u].gram[w];
  return [].concat(a === 0 ? G.spot : G.fix).flatMap(part => part.items[lvl].map(str => {
    if (part.kind === 'mc') { const [text, ans] = str.split('|'); return { kind: 'mc', prompt: part.prompt, text, options: part.options, answer: part.options[+ans] }; }
    if (part.kind === 'split') { const [subj, pred] = str.split('|').map(s => s.trim()); const sw = subj.split(/\s+/), pw = pred.split(/\s+/); return { kind: 'split', prompt: part.prompt, words: sw.concat(pw), answerIndex: sw.length }; }
    if (part.kind === 'punct') { const [text, ans] = str.split('|'); return { kind: 'mc', prompt: part.prompt, text: text + ' ___', options: ['. (period)', '? (question mark)', '! (exclamation point)'], answers: ans.split('').map(c => ({ '.': 0, '?': 1, '!': 2 }[c])) }; }
    const [text, right, ...wrong] = str.split('|');
    return { kind: 'mc', prompt: part.prompt, text, options: shuffle([right, ...wrong]), answer: right };
  }));
}
function startGram(w, a) {
  const meta = GRAM_ACTS[a];
  let items;
  if (w < 5) items = shuffle(makeQs(w, a, S.level)).slice(0, GRAM_ROUND);
  else { items = []; for (let k = 0; k < 5; k++) items = items.concat(shuffle(makeQs(k, a, S.level)).slice(0, 2)); items = shuffle(items); }
  ACT = { kind: 'gram', w, a, name: meta.name, icon: meta.icon, items, idx: 0, score: 0, wrong: [], solved: false, streak: 0, best: 0 };
  renderGram();
}
function isRight(q, i) { return q.answers ? q.answers.includes(i) : q.options[i] === q.answer; }
function renderGram() {
  if (ACT.idx >= ACT.items.length) return finishActivity(ACT.score / ACT.items.length);
  const q = ACT.items[ACT.idx];
  const fresh = !ACT.solved && ACT.wrong.length === 0;
  let body;
  if (q.kind === 'split') {
    body = `<div class="split">${q.words.map((wd, i) => {
      let c = '';
      if (ACT.solved) c = i < q.answerIndex ? 'subj' : 'pred';
      else if (ACT.wrong.includes(i)) c = 'wrong';
      return `<button class="w ${c}" data-act="pickSplit" data-i="${i}" ${ACT.solved ? 'disabled' : ''}>${esc(wd)}</button>`;
    }).join('')}</div>
    ${ACT.solved ? '<p><span class="tag" style="background:#dbe7fb;color:#2f4d86">SUBJECT</span> ➜ <span class="tag">PREDICATE</span></p>' : ''}`;
  } else {
    body = `<div class="sentence-card"><span class="txt">${esc(q.text)}</span><button class="speak" data-act="say" data-text="${esc(q.text)}">🔊</button></div>
    <div class="opts">${q.options.map((o, i) => {
      let c = ''; if (ACT.wrong.includes(i)) c = 'wrong'; if (ACT.solved && isRight(q, i)) c = 'right';
      return `<div class="opt-row"><button class="opt ${c}" data-act="pickOpt" data-i="${i}" ${ACT.solved || ACT.wrong.includes(i) ? 'disabled' : ''}>${esc(o)}</button><button class="speak" data-act="say" data-text="${esc(o)}">🔊</button></div>`;
    }).join('')}</div>`;
  }
  render(`${actHeader()}
    <div class="card">
      <div class="row"><p class="big-q" style="flex:1">${esc(q.prompt)}</p><button class="speak" data-act="say" data-text="${esc(q.prompt)}">🔊</button></div>
      ${body}
      <div class="feedback ${ACT.solved ? 'good' : 'bad'}" id="fb">${ACT.solved ? (ACT.wrong.length ? 'You got it! ✓' : 'Correct on the first try! ✓') : ACT.wrong.length ? 'Not quite. Try again!' : ''}</div>
      ${ACT.solved ? '<button class="btn sun" data-act="nextQ" id="nextBtn">Next ➜</button>' : ''}
    </div>`);
  if (ACT.solved) $('#nextBtn').focus();
  if (fresh && settings.read) setTimeout(() => speak(q.prompt + '. ' + (q.text || q.words.join(' '))), 250);
}
function answerGram(correct, i, el) {
  if (correct) { hit(el, ACT.wrong.length === 0); if (ACT.wrong.length === 0) ACT.score++; ACT.solved = true; }
  else { miss(); ACT.wrong.push(i); }
  renderGram();
}

/* ---------------- WRITING ---------------- */
/* Topic spinner: spin, then keep it or re-spin (2 re-spins). The ⭐ Wildcard slice lets them pick anything. */
const SPIN_COLORS = ['#ef5b3f', '#f29d16', '#2fae5b', '#2f86e0', '#8a4fd8', '#e2468f', '#14a3a3', '#c2410c'];
const RESPINS = 2;
const spinMemory = {};   // re-spins left per writing type; resets when they finish a paragraph
function renderWritingTopic(t) {
  renderTop();
  const mem = spinMemory[t] = spinMemory[t] || { spins: RESPINS, landed: [] };
  const T = WRITING[t];
  // The wheel holds everyday topics plus Big Question topics for the mountain they are on. Wildcard opens everything.
  const vis = T.topics.map((tp, i) => i).filter(i => !T.topics[i].eq || T.topics[i].eq[0] === S.unit);
  WS = { t, topic: null, side: null, step: null, vals: {}, active: null, mem, rot: 0, spinning: false, vis };
  const n = vis.length + 1, seg = 360 / n, R = 150, C = 160;
  const pt = (deg, r) => [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)];
  const slices = [...vis.map(i => T.topics[i].icon || '📝'), '⭐'].map((ic, i) => {
    const [x1, y1] = pt(i * seg - seg / 2, R), [x2, y2] = pt(i * seg + seg / 2, R), [tx, ty] = pt(i * seg, R * 0.66);
    return `<path d="M${C},${C} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z" fill="${i === n - 1 ? '#ffd23c' : SPIN_COLORS[i % SPIN_COLORS.length]}" stroke="#fff" stroke-width="3"/>
      <text x="${tx}" y="${ty + 12}" text-anchor="middle" font-size="34">${ic}</text>`;
  }).join('');
  render(`
    <button class="btn ghost small" data-act="goHome">← Home</button>
    <div class="band write" style="margin-top:12px"><span class="big">${T.icon}</span><span class="ttl" style="font-size:1.6rem">${T.name} Writing</span></div>
    <p class="muted">${T.blurb} Spin the wheel to get your topic!</p>
    <div class="grid g2" style="align-items:start">
      <div class="card" style="text-align:center">
        <div style="position:relative;max-width:340px;margin:0 auto">
          <svg viewBox="0 0 320 330" style="width:100%;height:auto;display:block">
            <g id="wheel" style="transform-box:view-box;transform-origin:160px 160px;transform:rotate(0deg)">${slices}</g>
            <circle cx="160" cy="160" r="22" fill="#fff" stroke="#22314d" stroke-width="4"/>
            <polygon points="160,30 146,2 174,2" fill="#22314d"/>
          </svg>
        </div>
        ${mem.landed.length ? '' : '<button class="btn sun" id="spinBtn" data-act="spin" style="font-size:1.3rem;padding:14px 36px;margin-top:10px">🎡 SPIN!</button>'}
      </div>
      <div>
        <div id="spinResult">${mem.landed.length ? `<div class="card" style="border:3px solid var(--sun)"><b>Your spins so far:</b>
          <div class="pool" style="justify-content:flex-start;margin:10px 0">${mem.landed.map(i => `<button class="chip" data-act="pickTopic" data-i="${i}">${T.topics[i].icon || '📝'} ${esc(T.topics[i].title)}</button>`).join('')}</div>
          ${mem.spins > 0 ? `<button class="btn ghost" data-act="respin">🎡 Spin again (${mem.spins} left)</button>` : ''}</div>` : ''}</div>
        <div class="card"><h3>On the wheel</h3>
          ${vis.map(i => T.topics[i]).map(tp => `<div style="padding:4px 0">${tp.icon || '📝'} ${esc(tp.title)}${tp.eq ? ' <span class="tag" style="background:#e3f1ff;color:#2459a6">📘 Unit ' + (tp.eq[0] + 1) + '</span>' : ''}</div>`).join('')}
          <div style="padding:4px 0">⭐ <b>Wildcard:</b> pick ANY topic, even ones from other mountains!</div>
        </div>
      </div>
    </div>`);
}
function spinWheel() {
  if (WS.spinning) return;
  const n = WS.vis.length + 1, seg = 360 / n;
  const k = Math.floor(Math.random() * n);
  const jitter = (Math.random() - 0.5) * seg * 0.6;
  const target = ((360 - k * seg + jitter) % 360 + 360) % 360;
  WS.rot += 360 * 5 + ((target - WS.rot % 360) + 360) % 360;
  const wheel = $('#wheel'), btn = $('#spinBtn');
  if (btn) btn.style.visibility = 'hidden';
  $('#spinResult').innerHTML = '';
  if (settings.calm) { wheel.style.transition = 'none'; wheel.style.transform = `rotate(${WS.rot}deg)`; return landWheel(k); }
  WS.spinning = true;
  wheel.style.transition = 'transform 3.2s cubic-bezier(.12,.7,.18,1)';
  wheel.style.transform = `rotate(${WS.rot}deg)`;
  let t = 0, gap = 50;
  while (t < 3000) { setTimeout(() => sfx('tap'), t); t += gap; gap *= 1.12; }
  setTimeout(() => { WS.spinning = false; landWheel(k); }, 3300);
}
function landWheel(k) {
  const T = WRITING[WS.t];
  const box = $('#spinResult'); if (!box) return;
  if (k === WS.vis.length) {
    sfx('gear'); confettiFrom(box, 40, 240);
    box.innerHTML = `<div class="card unlock" style="text-align:left"><span class="e">⭐</span>WILDCARD! You get to pick any topic:
      <div class="pool" style="justify-content:flex-start;margin-top:10px">${T.topics.map((tp, i) => `<button class="chip" data-act="pickTopic" data-i="${i}">${tp.icon || '📝'} ${esc(tp.title)}</button>`).join('')}</div></div>`;
    return;
  }
  sfx('streak'); confettiFrom(box, 20, 160);
  k = WS.vis[k];   // slice number ➜ topic number
  if (!WS.mem.landed.includes(k)) WS.mem.landed.push(k);
  const tp = T.topics[k];
  box.innerHTML = `<div class="card" style="border:3px solid var(--sun)">
    <div class="small muted">You landed on:</div>
    <h2 style="margin:6px 0">${tp.icon || '📝'} ${esc(tp.title)}</h2>
    ${tp.eq ? `<p class="small" style="background:#e3f1ff;border-radius:10px;padding:8px 10px">📘 Unit ${tp.eq[0] + 1} Big Question: ${esc(UNITS[tp.eq[0]].eq[tp.eq[1]])}</p>` : ''}

    </div>
    ${WS.mem.spins === 0 && WS.mem.landed.length > 1 ? `<p class="small muted" style="margin:12px 0 6px">Or pick one of your spins:</p>
      <div class="pool" style="justify-content:flex-start">${WS.mem.landed.filter(i => i !== k).map(i => `<button class="chip" data-act="pickTopic" data-i="${i}">${T.topics[i].icon || '📝'} ${esc(T.topics[i].title)}</button>`).join('')}</div>` : ''}
  </div>`;
  if (settings.read) speak('You landed on ' + tp.title);
}
function renderSidePick() {
  const tp = WRITING[WS.t].topics[WS.topic];
  render(`
    <button class="btn ghost small" data-act="openWriting" data-t="${WS.t}">← Topics</button>
    <h1 style="margin-top:12px">${esc(tp.title)}</h1>

}
function renderStepPick() {

    <button class="btn ghost small" data-act="openWriting" data-t="${WS.t}">← Topics</button>

    ${tp.eq ? `<div class="tip" style="background:#e3f1ff">📘 <b>Unit ${tp.eq[0] + 1} Big Question:</b> ${esc(UNITS[tp.eq[0]].eq[tp.eq[1]])}</div>` : ''}

const wFrames = () => WRITING[WS.t].frames[S.level];
/* Traffic-light roles: green = topic/conclusion, yellow = key idea, red = example/explain */
function roleOf(f, i, n) {
  const narr = WRITING[WS.t].id === 'narrative';
  if (i === 0 || /^In this paragraph|^I firmly believe/.test(f)) return { c: 'r-topic', l: narr ? 'Beginning' : 'Topic' };
  if (i === n - 1) return { c: 'r-topic', l: narr ? 'Ending' : 'Conclusion' };
  if (/\{(detail|evidence|proof|feeling|why)\}|example|instance|Some people|Although/.test(f)) return { c: 'r-ex', l: narr ? 'Details' : 'Example' };
  return { c: 'r-key', l: narr ? 'Event' : 'Key idea' };
}
function legendHTML() {
  const narr = WRITING[WS.t].id === 'narrative';
  return `<div class="legend"><span class="role r-topic">${narr ? 'Beginning & Ending' : 'Topic & Conclusion'}</span><span class="role r-key">${narr ? 'Events' : 'Key ideas'}</span><span class="role r-ex">${narr ? 'Details & feelings' : 'Examples & explaining'}</span></div>`;
}
function previewHTML() {
  const fr = wFrames();
  return fr.map((f, i) => `<span class="s-${roleOf(f, i, fr.length).c.slice(2)}">${sentenceOf(f, true)}</span>`).join(' ');
}
function tokenize(frame) {
  const out = [], re = /\{(=?)(\w+)\}/g; let last = 0, m;

const rnd = n => Math.floor(Math.random() * n);

const NAV_ACTS = new Set(['goStart', 'goHome', 'goUnit', 'openUnit', 'openWeek', 'openWriting', 'backSteps', 'quitAct', 'retryAct',
  'startSpell', 'startGram', 'mystery', 'pickTopic', 'pickSide', 'pickStep', 'finishWrite', 'finishFree', 'nextQ', 'teacher', 'logout',
  'spin', 'respin', 'startNew', 'loadCode', 'openBee', 'startBee', 'beeNext', 'beeEnd', 'startQuiz', 'quizAnswer', 'quizSpell', 'quizPick']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');

  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (NAV_ACTS.has(el.dataset.act)) stopSpeech();
  fn(el.dataset, el);
});

  let saved = null;
  try { saved = sessionStorage.getItem('wc_session'); } catch (e) {}
  if (saved) { try { useStudent(decodeCode(saved)); codeCopied = true; return renderHome(); } catch (e) {} }
  renderStart();
})();
</script>
