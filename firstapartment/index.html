<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Apartment | Math Models</title>
<style>
:root{
  --bg:#eef2f5; --card:#ffffff; --ink:#14202b; --muted:#5a6b7b; --line:#d9e1e8;
  --accent:#0d7a5c; --accent-2:#0a634a; --accent-soft:#e3f3ed; --accent-ink:#ffffff;
  --bad:#b3261e; --bad-soft:#fbe9e8; --warn:#9a5a00; --warn-soft:#fff3dc;
  --tape:#fbfaf4; --tape-ink:#2c3440; --key:#f3f6f8; --key-op:#e3eef7; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 16px rgba(20,32,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --card:#17202a; --ink:#e7edf2; --muted:#9aabb9; --line:#2a3744;
    --accent:#35b98f; --accent-2:#4fd0a5; --accent-soft:#16352c; --accent-ink:#06140f;
    --bad:#ff8a80; --bad-soft:#3a1d1c; --warn:#f0b35a; --warn-soft:#3a2c14;
    --tape:#1d2630; --tape-ink:#dfe7ee; --key:#212c37; --key-op:#1d3346; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-size:15px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1240px;margin:0 auto;padding:20px}
.layout.nocalc{grid-template-columns:minmax(0,1fr);max-width:860px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
h2{font-size:22px;line-height:1.25;margin:0 0 10px}
h3{font-size:18px;margin:0 0 8px}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--key)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.input{border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);min-height:50px;width:100%}
.input:focus{outline:none;border-color:var(--accent)}
.error{color:var(--bad);font-weight:600;min-height:1.5em}
.speak{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--key);flex:none}
.speak:hover{border-color:var(--accent)}
.speak svg{width:20px;height:20px}
.say{display:flex;gap:12px;align-items:flex-start}
.say > div{flex:1;min-width:0}
.progress{display:flex;gap:6px;margin:4px 0 16px}
.progress span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--warn)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.job{border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--card);text-align:left}
.job:hover{border-color:var(--accent)}
.job.sel{border-color:var(--accent);background:var(--accent-soft)}
.job .jt{font-weight:800}
.job .je{color:var(--muted);font-size:15px}
.job .jw{font-size:24px;font-weight:800;margin-top:6px}
.job .jw small{font-size:15px;font-weight:600;color:var(--muted)}
.daylist{display:grid;gap:10px}
.day{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);text-align:left;width:100%}
.day:hover{border-color:var(--accent)}
.day .dn{width:52px;height:52px;border-radius:10px;background:var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;line-height:1.1;flex:none}
.day .dt{font-weight:800}
.day .ds{color:var(--muted);font-size:15px}
.day .score{margin-left:auto;font-weight:800;color:var(--accent)}
.weektabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.weektabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.weektabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.weektabs button:disabled{opacity:.45;cursor:not-allowed}
.learnbox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.rule{font-size:22px;font-weight:800;margin:8px 0}
.example{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.qnum{font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.qtext{font-size:22px;font-weight:700;line-height:1.35;margin:4px 0 14px}
.answer{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.moneyin{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;background:var(--card);min-height:56px;flex:1;min-width:180px;max-width:320px}
.moneyin:focus-within{border-color:var(--accent)}
.moneyin span{padding-left:14px;font-size:22px;font-weight:800;color:var(--muted)}
.moneyin input{border:none;background:transparent;font-size:24px;font-weight:700;padding:10px 12px;width:100%;min-width:0}
.moneyin input:focus{outline:none}
.choices{display:grid;gap:10px;max-width:420px}
.choice{border:2px solid var(--line);border-radius:10px;padding:14px;background:var(--card);font-weight:700;text-align:left;font-size:20px}
.choice:hover{border-color:var(--accent)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-weight:600}
.fb.good{background:var(--accent-soft);color:var(--ink)}
.fb.bad{background:var(--bad-soft)}
.fb.warn{background:var(--warn-soft)}
.fb.hint{background:var(--key)}
.stub{border:2px solid var(--ink);border-radius:8px;background:var(--card);font-variant-numeric:tabular-nums;overflow:hidden;margin:12px 0}
.stub .sh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--card);padding:8px 14px;font-weight:700;font-size:15px}
.stub table{width:100%;border-collapse:collapse;font-size:17px}
.stub td{padding:8px 14px;border-top:1px solid var(--line)}
.stub td:last-child{text-align:right;font-weight:700}
.stub tr.total td{border-top:2px solid var(--ink);font-weight:800}
details.stubwrap summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}
.lifecard{border-radius:16px;padding:26px;background:linear-gradient(135deg,var(--warn-soft),var(--card));border:2px solid var(--warn);text-align:center;margin:12px auto;max-width:460px}
.lifecard .lt{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:var(--warn)}
.lifecard .lh{font-size:28px;font-weight:800;margin:6px 0}
.lifecard .ld{font-size:19px}
.lifecard .lx{margin-top:12px;font-size:20px;font-weight:800}
.bigscore{font-size:64px;font-weight:900;line-height:1;margin:10px 0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:2px;background:var(--key);padding:4px 10px;border-radius:6px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-top:12px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* calculator */
.calc{position:sticky;top:78px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.calc .ctitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calc .ctitle b{font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.screen{background:var(--key);border-radius:10px;padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums}
.screen .pend{min-height:22px;font-size:15px;color:var(--muted)}
.screen .disp{font-size:34px;font-weight:800;line-height:1.15;word-break:break-all}
.screenrow{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.screenrow .screen{flex:1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{min-height:52px;border:none;border-radius:10px;background:var(--key);font-size:22px;font-weight:700}
.key:hover{filter:brightness(.96)}
.key.op{background:var(--key-op)}
.key.eq{background:var(--accent);color:var(--accent-ink)}
.key.fn{font-size:16px}
.usebtn{width:100%;margin-top:10px}
.tape{margin-top:12px;background:var(--tape);color:var(--tape-ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-height:190px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.tape .tl{padding:3px 0;border-bottom:1px dotted var(--line);display:flex;gap:8px}
.tape .tl i{font-style:normal;color:var(--muted);flex:none}
.tape .empty{color:var(--muted);font-family:inherit}
.calcfab{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);padding:16px}
  .calc{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:16px 16px 0 0;z-index:20;max-height:85vh;overflow:auto}
  .calc.open{display:block}
  .calcfab{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:21}
  .qtext{font-size:20px}
}
/* teacher */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tgrid ul{list-style:none;padding:0;margin:0}
.tgrid li{font-family:ui-monospace,Menlo,Consolas,monospace;padding:3px 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
pre.script{white-space:pre-wrap;background:var(--key);border-radius:10px;padding:14px;font:15px/1.6 system-ui,sans-serif;max-height:320px;overflow:auto}
table.plan{width:100%;border-collapse:collapse;font-size:16px}
table.plan td,table.plan th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.ok{color:var(--accent);font-weight:800}
.no{color:var(--bad);font-weight:800}
@media print{.topbar,.calc,.calcfab,.noprint{display:none!important}.layout{display:block}}
/* ---- game layer ---- */
.fundchip{background:var(--ink);color:var(--card);font-variant-numeric:tabular-nums;position:relative}
.fundchip.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.floatcash{position:fixed;z-index:50;font-weight:900;font-size:24px;color:var(--accent);pointer-events:none;animation:floatup 1.2s ease-out forwards;text-shadow:0 1px 0 var(--card)}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.section-tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--key);margin-right:8px}
.section-tag.job{background:var(--warn-soft);color:var(--warn)}
.section-tag.call{background:var(--accent-soft);color:var(--accent)}
.payout{font-size:13px;color:var(--muted);font-weight:700}
.story{border:2px solid var(--ink);border-radius:14px;padding:18px 20px;margin:12px 0;background:var(--card)}
.story .kicker{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--bad)}
.story h2{font-size:26px;margin:4px 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--key)}
.fact b{display:block;font-size:20px}
.fact span{font-size:14px;color:var(--muted)}
.ad{border:2px dashed var(--bad);border-radius:12px;padding:14px;text-align:center;margin:12px 0;background:var(--bad-soft)}
.ad .big{font-size:26px;font-weight:900}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.streak{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--warn)}
textarea.input{min-height:90px;resize:vertical}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.promo{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.promo .card{max-width:420px;text-align:center;animation:pop .4s ease}
.promo .rank{font-size:34px;font-weight:900;margin:6px 0}
.apt{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block;background:#1d2530}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.item .in{font-weight:800}
.item .ip{font-size:22px;font-weight:900}
.item .ia{font-size:14px;color:var(--muted)}
.item.owned{background:var(--accent-soft);border-color:var(--accent)}
.item .btn{min-height:40px;padding:8px 12px}
.rankbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.rankbar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   SETTINGS FOR MRS. GROH  (the only part you ever need to edit)
   ===================================================================== */
const CONFIG = {
  teacherPasscode: "groh",

  // Paste your Google Form PRE-FILLED link here (see Teacher page, "Connect your Form").
  // Fill the boxes with the words NAME, CODE, DAY, SCORE, CHECK, TAPE before copying the link.
  formPrefilledLink: "https://docs.google.com/forms/d/e/1FAIpQLSc9R9WJwXiAAVl8HvR6kQn5wZCa9Hg5OXurWgZdwIgrgzlxSQ/viewform?usp=pp_url&entry.142082172=NAME&entry.1573987806=CODE&entry.1465630537=DAY&entry.1481547865=SCORE&entry.92298649=CHECK&entry.247348893=TAPE",

  budgetSimUrl: "https://mrs-groh-math-budget.netlify.app/",
  arcadeUrl: "https://mrs-groh-math-models.netlify.app/",

  // Paste a YouTube link or a Google Drive share link for each video. Leave "" if no video yet.
  videos: {
    w1d1: "https://drive.google.com/file/d/1s7h8LzoYWJvoVaNxly0N41qFnLQJCPjW/view?usp=sharing",
    w1d2: "https://drive.google.com/file/d/1DvWFljy2oGgPU8KS4wrdUkC5dWA0hZVx/view?usp=sharing",
    w1d3: "https://drive.google.com/file/d/1MR5swmeMr9_vltCXzqu4Nl0Z87JnukQ1/view?usp=sharing",
    w2d1: "https://drive.google.com/file/d/1X6VQL8w2Kdlc3pfCpdmtntonK99m12i8/view?usp=sharing",
    w3d1: "https://drive.google.com/file/d/1gHPbGnOY8cppukqQO5v3LM79Ou73C1_c/view?usp=sharing",
    w4d1: "https://drive.google.com/file/d/1uuSbd5wCd8qCytW7Apv52cMvfPwZnnN9/view?usp=sharing",
    w5d1: "https://drive.google.com/file/d/1W3K3xS2Lr6o3hMV_Gdd-hZFj07zXTiiW/view?usp=sharing",
    w6d1: "https://drive.google.com/file/d/1LYAACJqOHuPNvq9DSG0uKLwNIgvCi-tt/view?usp=sharing"
  },

  // Student login codes. Hand each kid one code. Only you know which list is which.
  codes: {
    1: ["4827","1953","7314","2468","9051","3692","5173","8406","6230","1789","4561","7925","3308","9674","2145"],
    2: ["6391","2074","8543","1628","5917","3450","7286","9802","4139","6765","1394","8021","5588","2917","7640"],
    3: ["3875","9216","1562","6048","4793","8359","2601","7132","5484","9947","3026","6613","1270","8795","4418"]
  },
  codePrefix: "APT-",
  salt: "first-apartment-groh"
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
function money(x){ const v = r2(x); const whole = Number.isInteger(v); return '$' + v.toLocaleString('en-US',{minimumFractionDigits: whole?0:2, maximumFractionDigits:2}); }
function money2(x){ return '$' + r2(x).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(x){ return (+(+x).toFixed(10)).toLocaleString('en-US',{maximumFractionDigits:10}); }
function fnv(str){ let h = 0x811c9dc5; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const normName = s => String(s||'').trim().replace(/\s+/g,' ');
function checkCode(name, code, day, score){
  return fnv([normName(name).toLowerCase(), String(code).toUpperCase().replace(/\s/g,''), day, String(score), CONFIG.salt].join('|')).toString(36).toUpperCase().slice(-5).padStart(5,'0');
}
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function tierFromCode(raw){
  const digits = String(raw||'').replace(/[^0-9]/g,'');
  for (const t of [1,2,3]) if (CONFIG.codes[t].includes(digits)) return {tier:t, code: CONFIG.codePrefix + digits};
  return null;
}

/* ---------- read aloud ---------- */
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const clean = String(text).replace(/\$(\d[\d,]*)\.(\d\d)/g, (m,d,c) => d + ' dollars and ' + c + ' cents').replace(/\$/g,'').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ');
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 0.85; u.lang = 'en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}
const SAY = {}; let sayN = 0;
function sayBtn(text){ const id = 's' + (++sayN); SAY[id] = text; return `<button class="speak" data-say="${id}" aria-label="Read aloud" title="Read aloud">${SPK}</button>`; }
const strip = h => String(h).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();

/* ---------- jobs, life cards ---------- */
const JOBS = [
  {id:'grocery', title:'Grocery Stocker', employer:'FreshMart Grocery', icon:'🛒'},
  {id:'food', title:'Fast Food Crew', employer:'Burger Barn', icon:'🍔'},
  {id:'carwash', title:'Car Wash Attendant', employer:'Sparkle Car Wash', icon:'🚗'},
  {id:'warehouse', title:'Warehouse Packer', employer:'Lone Star Shipping', icon:'📦'},
  {id:'pets', title:'Pet Store Helper', employer:'Paws & Claws', icon:'🐾'},
  {id:'movies', title:'Movie Theater Crew', employer:'Starlight Cinema', icon:'🎬'}
];
function jobOffers(){
  return JOBS.map(j => {
    const R = rng(fnv(normName(S.name).toLowerCase() + '|' + S.code + '|' + j.id));

    if (S.tier === 1) w = 10 + Math.floor(R()*6);

  });

const up = x => Math.ceil(x - 1e-9);
const takeHomeHr = w => r2(w - r2(w*0.0765) - r2(w*0.10));
const takeHomeMo = w => { const g = r2(64*w), n = r2(g - r2(g*0.0765) - r2(g*0.10)); return r2(r2(26*n)/12); };
const CALLP = 'Back it up. Use at least one number from today.';
function payoff(P, rate, payFn){
  let b = P, m = 0, int = 0;
  while (b > 0.005 && m < 600){ const i = r2(b*rate); int = r2(int + i); b = r2(b + i); const p = Math.min(b, payFn(b, i)); b = r2(b - p); m++; }
  return {months:m, interest:int};
}

function getBank(){
  if (S.preview) return S.previewBank || (S.previewBank = {fund:0, earned:0, owned:[], rank:0, mute:false});
  return store.get(keyBase() + '|bank', {fund:0, earned:0, owned:[], rank:0, mute:false});
}
function setBank(b){ if (S.preview) S.previewBank = b; else store.set(keyBase() + '|bank', b); }
function rankOf(earned){ let r = 0; RANKS.forEach((k,i) => { if (earned >= k.at) r = i; }); return r; }
function currentWage(){ const j = getJob(); if (!j) return 0; return r2(j.wage + RAISE * getBank().rank); }

let shownFund = null;
function pay(amount, label){
  if (amount <= 0) return;
  const b = getBank();
  b.fund = r2(b.fund + amount); b.earned = r2(b.earned + amount);
  const newRank = rankOf(b.earned);
  const promoted = newRank > b.rank;
  if (promoted) b.rank = newRank;
  setBank(b);
  if (!b.mute) chaChing();
  floatCash('+' + money(amount) + (label ? ' ' + label : ''));
  if (promoted) S.pendingPromo = newRank;
}
function floatCash(text){
  const chip = $('#fundchip'); if (!chip) return;
  const r = chip.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'floatcash'; el.textContent = text;
  el.style.left = Math.max(8, r.left - 20) + 'px'; el.style.top = (r.bottom + 6) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
}
function animateFund(){
  const chip = $('#fundchip'); if (!chip) return;
  const target = getBank().fund;
  const from = shownFund === null ? target : shownFund;
  shownFund = target;
  if (from === target){ chip.querySelector('b').textContent = money(target); return; }
  chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump');
  const t0 = performance.now(), dur = 700;
  const step = now => { const p = Math.min(1, (now - t0) / dur); const v = from + (target - from) * (1 - Math.pow(1 - p, 3));
    const b = chip.querySelector('b'); if (b) b.textContent = money(Math.round(v)); if (p < 1) requestAnimationFrame(step); else if (b) b.textContent = money(target); };
  requestAnimationFrame(step);
}
let AC = null;
function chaChing(){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    [[1318.5,0],[1760,0.09],[2637,0.18]].forEach(([f,d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t+d); g.gain.exponentialRampToValueAtTime(0.18, t+d+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.25);
      o.connect(g).connect(AC.destination); o.start(t+d); o.stop(t+d+0.3);
    });
  }catch(e){}
}

/* =====================================================================
   CALCULATOR
   ===================================================================== */
const C = { disp:'0', acc:null, op:null, fresh:true, hist:[], tape:[] };
function calcSnap(){ C.hist.push(JSON.stringify({disp:C.disp,acc:C.acc,op:C.op,fresh:C.fresh})); if (C.hist.length>60) C.hist.shift(); }
function calcTag(){
  if (!S.flow) return '';
  const st = S.flow.steps[S.flow.i];
  if (!st) return '';
  if (st.kind==='q'){ const p = S.flow.all[st.qi]; return (p.section==='warm'?'W':'Q') + (p.n); }
  return '';
}
function doOp(a, op, b){ const r = op==='+' ? a+b : op==='−' ? a-b : op==='×' ? a*b : (b===0 ? NaN : a/b); return +r.toFixed(10); }
function calcKey(k){
  if (k==='undo'){ const s = C.hist.pop(); if (s){ Object.assign(C, JSON.parse(s)); } return drawCalc(); }
  calcSnap();
  if (/^[0-9]$/.test(k)){
    if (C.fresh || C.disp==='0'){ C.disp = k; C.fresh = false; }
    else if (C.disp.replace(/[-.]/g,'').length < 12) C.disp += k;
  } else if (k==='.'){
    if (C.fresh){ C.disp = '0.'; C.fresh = false; } else if (!C.disp.includes('.')) C.disp += '.';
  } else if (k==='back'){
    if (!C.fresh){ C.disp = C.disp.length>1 ? C.disp.slice(0,-1) : '0'; if (C.disp==='-') C.disp='0'; }
  } else if (k==='C'){
    C.disp='0'; C.acc=null; C.op=null; C.fresh=true;
  } else if (k==='%'){
    C.disp = String(+((+C.disp)/100).toFixed(10)); C.fresh = false;
  } else if (['+','−','×','÷'].includes(k)){
    const cur = +C.disp;
    if (C.acc!==null && C.op && !C.fresh){
      const r = doOp(C.acc, C.op, cur);
      addTape(`${num(C.acc)} ${C.op} ${num(cur)} = ${isNaN(r)?'error':num(r)}`);
      C.acc = isNaN(r) ? null : r; C.disp = isNaN(r) ? '0' : String(r);
    } else if (C.acc===null || !C.op || !C.fresh) C.acc = cur;
    C.op = k; C.fresh = true;
  } else if (k==='='){
    if (C.acc!==null && C.op){
      const cur = +C.disp, r = doOp(C.acc, C.op, cur);
      addTape(`${num(C.acc)} ${C.op} ${num(cur)} = ${isNaN(r)?'error':num(r)}`);
      C.disp = isNaN(r) ? '0' : String(r); C.acc=null; C.op=null; C.fresh=true;
    }
  }
  drawCalc();
}
function addTape(line){ C.tape.push({tag:calcTag(), line}); if (S.flow){ S.flow.tape = C.tape; saveFlow(); } }
function drawCalc(){
  const d = $('#cdisp'); if (!d) return;
  d.textContent = num(C.disp);
  $('#cpend').textContent = C.acc!==null && C.op ? `${num(C.acc)} ${C.op}` : '';
  const t = $('#ctape');
  t.innerHTML = C.tape.length ? C.tape.map(x => `<div class="tl"><i>${esc(x.tag||'·')}</i><span>${esc(x.line)}</span></div>`).join('') : '<div class="empty">Your work shows up here.</div>';
  t.scrollTop = t.scrollHeight;
}
function calcHTML(){
  const K = (k, cls='', label) => `<button class="key ${cls}" data-k="${k}" aria-label="${label||k}">${label||k}</button>`;
  return `<aside class="calc" id="calc" aria-label="Calculator">
    <div class="ctitle"><b>Calculator</b><button class="linkbtn noprint" id="calcclose" style="display:none">Close</button></div>
    <div class="screenrow">
      <div class="screen"><div class="pend" id="cpend"></div><div class="disp" id="cdisp">0</div></div>
      <button class="speak" id="cspeak" aria-label="Read the number aloud" title="Read aloud">${SPK}</button>
    </div>
    <div class="keys">
      ${K('C','fn')}${K('back','fn','⌫')}${K('%','fn')}${K('÷','op')}
      ${K('7')}${K('8')}${K('9')}${K('×','op')}
      ${K('4')}${K('5')}${K('6')}${K('−','op')}
      ${K('1')}${K('2')}${K('3')}${K('+','op')}
      ${K('undo','fn','Undo')}${K('0')}${K('.')}${K('=','eq')}
    </div>
    <button class="btn ghost usebtn" id="cuse">Put this number in my answer ↓</button>
    <div class="tape" id="ctape" aria-label="Calculator tape"></div>
  </aside>`;
}
document.addEventListener('keydown', e => {
  if (!$('#calc')) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input' || tag==='select' || tag==='textarea') return;
  const map = {'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'back','Escape':'C','.':'.','%':'%'};
  if (/^[0-9]$/.test(e.key)){ calcKey(e.key); e.preventDefault(); }
  else if (map[e.key]){ calcKey(map[e.key]); e.preventDefault(); }
  else if ((e.ctrlKey||e.metaKey) && e.key==='z'){ calcKey('undo'); e.preventDefault(); }
});

/* =====================================================================
   FLOW
   ===================================================================== */
function flowKey(d){ return keyBase() + '|flow|' + d; }
function saveFlow(){ if (S.flow && !S.preview) store.set(flowKey(S.dayId), {i:S.flow.i, n:S.flow.steps.length, wage:S.flow.ctx.wage, res:S.flow.res, callRes:S.flow.callRes, streak:S.flow.streak, bonus:S.flow.bonus, tape:S.flow.tape}); }

function buildFlow(dayId, savedWage){
  const D = DAYS[dayId];
  const job = getJob();
  const ctx = { wage: savedWage || currentWage(), job, card: D.lifeCard ? lifeCard(dayId, D.lifeCard) : null };
  const built = job ? D.build(S.tier, ctx) : null;
  const f = { D, ctx, built, i:0, tape:[], streak:0, bonus:0, callRes:null };
  f.steps = [{kind:'intro'}];
  if (D.video) f.steps.push({kind:'video'});
  if (D.pickJob || (!job && D.needsJob)) f.steps.push({kind:'job'});
  f.steps.push({kind:'learn'});
  if (D.lifeCard) f.steps.push({kind:'card'});
  layoutQuestions(f);
  return f;
}
function layoutQuestions(f){
  // remove old question/story/call/done steps then rebuild from f.built
  f.steps = f.steps.filter(s => ['intro','video','job','learn','card'].includes(s.kind));
  const b = f.built;
  const warm = b ? (b.warmup||[]) : [], job = b ? b.problems : Array.from({length:6}, () => ({}));
  f.all = [...warm.map((p,i) => ({...p, section:'warm', n:i+1})), ...job.map((p,i) => ({...p, section:'job', n:i+1}))];
  f.nWarm = warm.length; f.nJob = job.length;
  const learnAt = f.steps.findIndex(s => s.kind==='learn');
  const after = f.steps.splice(learnAt + 1);           // e.g. life card
  warm.forEach((_,i) => f.steps.push({kind:'q', qi:i}));
  if (b && b.story) f.steps.push({kind:'story'});
  after.forEach(s => f.steps.push(s));
  job.forEach((_,i) => f.steps.push({kind:'q', qi:warm.length + i}));
  if (b && b.call) f.steps.push({kind:'call'});
  f.steps.push({kind:'done'});
  if (!f.res || f.res.length !== f.all.length) f.res = f.all.map(() => ({tries:0, pts:0, done:false, hint:false}));
}
function refreshBuilt(){
  const f = S.flow, job = getJob();
  f.ctx.job = job; f.ctx.wage = currentWage();
  f.built = job ? f.D.build(S.tier, f.ctx) : null;
  layoutQuestions(f);
}
function openDay(dayId){
  S.dayId = dayId;
  const saved = S.preview ? null : store.get(flowKey(dayId), null);
  S.flow = buildFlow(dayId, saved && saved.wage);
  if (saved && saved.res && saved.res.length === S.flow.res.length && saved.n === S.flow.steps.length){
    Object.assign(S.flow, {i:Math.min(saved.i||0, S.flow.steps.length-1), res:saved.res, callRes:saved.callRes||null, streak:saved.streak||0, bonus:saved.bonus||0, tape:saved.tape||[]});
  }
  C.tape = S.flow.tape; C.disp='0'; C.acc=null; C.op=null; C.fresh=true; C.hist=[];
  S.screen = 'day'; render();
}

function fmtAns(p){
  if (p.type==='choice') return esc(p.a);
  if (p.unit==='$') return S.tier===1 && Number.isInteger(p.a) ? money(p.a) : money2(p.a);
  if (p.unit==='%') return p.a + '%';
  if (p.unit==='hrs') return p.a + ' hours';
  return String(p.a);
}
function embedUrl(u){
  if (!u) return '';
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
  if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0';
  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return u;
}

function scoreOf(f){
  let pts = f.res.reduce((a,r) => a + r.pts, 0), n = f.res.length;
  if (f.built && f.built.call){ n += 1; if (f.callRes && f.callRes.done) pts += f.callRes.full ? 1 : 0.5; }
  return Math.round(pts / n * 100);
}
function tapeText(){
  const f = S.flow;
  const call = f && f.callRes && f.callRes.done ? `CALL: ${f.built.call.options[f.callRes.pick]} | WHY: ${f.callRes.why} || ` : '';
  return (call + (C.tape.map(x => (x.tag?x.tag+': ':'') + x.line).join(' ; ') || '(no calculator use)')).slice(0,1800);
}
function resultsView(){
  const f = S.flow, score = scoreOf(f);
  const cc = checkCode(S.name, S.code, S.dayId, score);
  const earnedToday = f.res.reduce((a,r) => a + (r.cash||0) + (r.streakBonus?PAY.streak:0), 0) + (f.callRes && f.callRes.cash || 0);
  if (!S.preview) store.set(keyBase() + '|done|' + S.dayId, {score, cc});
  const link = formLink({NAME:S.name, CODE:S.code, DAY:S.dayId + ' ' + f.D.title, SCORE:String(score), CHECK:cc, TAPE:tapeText()});
  const firstTry = f.res.filter(r => r.pts===1).length;
  return `<div style="text-align:center">
    <div class="eyebrow">Shift complete</div>
    <div class="bigscore">${score}%</div>
    <p style="margin:0">${firstTry} of ${f.res.length} right on the first try · you earned <b>${money(earnedToday)}</b> today</p>
    <p>Check code: <span class="code">${cc}</span></p>
    ${S.preview ? '<div class="fb hint">Preview mode. Nothing is saved or turned in.</div>'
      : link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">Turn it in</a>
               <p class="muted" style="font-size:15px">A Google Form opens. Just press <b>Submit</b>. Don't change anything.</p>`
             : `<div class="fb warn">Show this screen to Mrs. Groh before you close it.</div>`}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="toapt">Spend it: My Apartment →</button></div>
    <div class="learnbox" style="text-align:left;margin-top:20px"><b>Reward round:</b> turned in? Open
      <a href="${esc(CONFIG.budgetSimUrl)}" target="_blank" rel="noopener">the Budget Sim</a> or
      <a href="${esc(CONFIG.arcadeUrl)}" target="_blank" rel="noopener">the Money Arcade</a>.</div>
  </div>`;
}
function formLink(values){
  const link = CONFIG.formPrefilledLink; if (!link) return null;
  try{
    const u = new URL(link), out = new URLSearchParams(); out.set('usp','pp_url');
    for (const [k,v] of u.searchParams){ if (!k.startsWith('entry.')) continue; const key = v.trim().toUpperCase(); if (key in values) out.set(k, values[key]); }
    return u.origin + u.pathname + '?' + out.toString();
  }catch(e){ return null; }
}

/* ---------- answer checking + payouts ---------- */
function parseAns(s){ const t = String(s).replace(/[$,%\s]|hours?|hrs?/gi,''); if (t==='' || isNaN(+t)) return null; return +t; }
let cooldown = null;
function submitAnswer(val){
  const f = S.flow, st = f.steps[f.i], p = f.all[st.qi], r = f.res[st.qi];
  if (r.done || cooldown) return;
  let correct;
  if (p.type==='choice') correct = val === p.a;
  else {
    const v = parseAns(val);
    if (v===null){ $('#fbwrap').innerHTML = `<div class="fb warn">Type a number first.</div>`; return; }
    correct = Math.abs(v - p.a) < (S.tier===1 && Number.isInteger(p.a) ? 0.005 : 0.0105); // within a penny for rounding
  }
  r.tries++;
  const base = p.section==='warm' ? PAY.warm : PAY.job;
  if (correct){
    r.done = true; r.pts = r.tries===1 ? 1 : 0.5; r.cash = r.tries===1 ? base : base/2;
    if (r.tries===1){ f.streak++; if (f.streak % 3 === 0){ r.streakBonus = true; } } else f.streak = 0;
    pay(r.cash + (r.streakBonus ? PAY.streak : 0));
  } else if (r.tries>=2 || p.type==='choice'){ r.done = true; r.pts = 0; r.cash = 0; f.streak = 0; }
  else f.streak = 0;
  saveFlow(); render();
  if (!correct && !r.done){
    cooldown = true; let n = 4;
    const tick = () => { const bb = $('#check'); if (!bb){ cooldown=null; return; } if (n<=0){ bb.disabled=false; bb.textContent='Check'; cooldown=null; return; } bb.disabled = true; bb.textContent = 'Check your tape… ' + n; n--; setTimeout(tick, 1000); };
    tick();
  }
}
function lockCall(){
  const f = S.flow, cr = f.callRes || {};
  const why = ($('#why').value || '').trim();
  cr.why = why;
  if (cr.pick === undefined){ $('#callfb').innerHTML = `<div class="fb warn">Pick one first.</div>`; f.callRes = cr; return; }
  const words = why.split(/\s+/).filter(Boolean).length;
  const hasNum = /\d/.test(why);
  if (words < 6 || !hasNum){
    cr.tries = (cr.tries||0) + 1;
    if (cr.tries < 2){ f.callRes = cr; $('#callfb').innerHTML = `<div class="fb warn">${words<6?'Give me a full sentence.':'Back it up with a number from today.'} Try once more for the full ${money(PAY.call)}.</div>`; return; }
  }
  cr.done = true; cr.full = words >= 6 && hasNum; cr.cash = cr.full ? PAY.call : 10;
  f.callRes = cr; pay(cr.cash, 'bonus'); saveFlow(); render();
}

    <p class="muted">Runs the lessons exactly like a kid sees them. Nothing saves or turns in.</p>
    <div class="row">${[1,2,3].map(t => `<button class="btn ghost" data-prev="${t}">Preview Tier ${t}</button>`).join('')}</div></div>

  <div class="card"><h2>Student codes</h2>
    <p class="muted">Give each kid one code and write it down on your roster. All codes look the same to them. A kid keeps the same code all unit (their job is saved to name + code on that Chromebook). To move a kid to a different tier, just give them a code from another list.</p>
    <div class="tgrid">${[1,2,3].map(t => `<div><h3>Tier ${t}</h3><ul>${CONFIG.codes[t].map(c => `<li>${CONFIG.codePrefix}${c}</li>`).join('')}</ul></div>`).join('')}</div>
    <p class="muted" style="font-size:15px;margin-bottom:0">Tier 1: whole dollars, one step, direct hints. Tier 2: cents, two steps. Tier 3: percents, overtime, multi-step. Every tier has 6 questions and looks identical.</p></div>

  <div class="card"><h2>How the Fund works</h2>
    <p>Right answers pay into each kid's private <b>Apartment Fund</b>: warm-up $10, job steps $25, the call $50, and +$15 for every 3 first-try answers in a row. Second tries pay half. Kids spend it on stuff for their apartment. Nobody can see anyone else's.</p>
    <p style="margin-bottom:0">Lifetime earnings unlock promotions (Crew $300, Shift Lead $900, Assistant Manager $1,800, Manager $3,000). Each one is a +$1/hr raise that shows up in the next lesson's math. The Call's choice and reason get turned in with the tape, so you can read their thinking in your Sheet.</p></div>

  <div class="card"><h2>Check a score</h2>
    <p class="muted">If a score in your Sheet looks off, type in what the student turned in. If the check code doesn't match, the score was changed.</p>
    <div class="row">
      <input class="input" id="vn" placeholder="Name" style="max-width:200px">
      <input class="input" id="vc" placeholder="APT-0000" style="max-width:140px">
      <select class="input" id="vd" style="max-width:220px">${Object.keys(DAYS).map(d => `<option value="${d}">${d} ${esc(DAYS[d].title)}</option>`).join('')}</select>
      <input class="input" id="vs" placeholder="Score" style="max-width:100px">
      <input class="input" id="vk" placeholder="Check code" style="max-width:150px">
      <button class="btn" id="vgo">Check</button>
    </div><div id="vout" style="margin-top:10px"></div></div>

  <div class="card"><h2>Connect your Google Form ${formOk ? `<span class="ok">· connected (${nFields} of 6 boxes)</span>` : '<span class="no">· not connected yet</span>'}</h2>
    <ol>
      <li>Make a new Google Form on your school account. Add <b>6 Short answer</b> questions titled: <b>Name, Code, Day, Score, Check Code, Calculator Tape</b>. Don't make any of them required.</li>
      <li>Click the <b>Responses</b> tab → <b>Link to Sheets</b>. That Sheet is your gradebook.</li>
      <li>Click the <b>⋮</b> menu (top right) → <b>Get pre-filled link</b>.</li>
      <li>In the boxes, type these exact words: <b>NAME</b>, <b>CODE</b>, <b>DAY</b>, <b>SCORE</b>, <b>CHECK</b>, <b>TAPE</b>.</li>
      <li>Click <b>Get link</b> → <b>Copy link</b>. Send it to Claude, or paste it into <code>formPrefilledLink</code> at the top of this file.</li>
    </ol></div>

  <div class="card"><h2>45-minute class flow</h2>
    <table class="plan">
      <tr><th>Time</th><th>Students</th><th>You</th></tr>
      <tr><td>0–5</td><td>Chromebook out, log in, headphones on</td><td>Door, attendance</td></tr>
      <tr><td>5–10</td><td>Video (Mon, Wed) or the lesson screen</td><td>Walk the room once</td></tr>
      <tr><td>10–22</td><td>Work in the app</td><td><b>Table group 1:</b> Tier 1 kids, every day</td></tr>
      <tr><td>22–34</td><td>Work in the app</td><td><b>Table group 2:</b> rotates (see below)</td></tr>
      <tr><td>34–42</td><td>Turn it in, then the reward round (Budget Sim or Arcade)</td><td>Check the Sheet, spot low scores</td></tr>
      <tr><td>42–45</td><td>Chromebooks away</td><td></td></tr>
    </table>
    <h3 style="margin-top:14px">Table group 2 rotation</h3>
    <table class="plan"><tr><td>Mon</td><td>Tier 2</td></tr><tr><td>Tue</td><td>Tier 3</td></tr><tr><td>Wed</td><td>Tier 2</td></tr><tr><td>Thu</td><td>Anyone under 70% on Tue or Wed</td></tr></table></div>

  <div class="card"><h2>Video scripts (paste into Audiate)</h2>
    <p class="muted">Same video for every tier. Each one is under Audiate's 5-minute avatar limit. Upload to YouTube (unlisted) or Drive, then paste the link into <code>videos</code> at the top of this file.</p>
    ${Object.entries(SCRIPTS).map(([k,s]) => `<h3>${esc(s.title)}</h3><pre class="script" id="scr-${k}">${esc(s.text)}</pre><button class="btn ghost" data-copy="${k}">Copy script</button>`).join('<hr style="border:none;border-top:1px solid var(--line);margin:18px 0">')}
  </div>`;
}


/* =====================================================================
   EVENTS
   ===================================================================== */
function bind(){
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { try{ if (speechSynthesis.speaking){ hardStop(); return; } }catch(e){} speak(SAY[b.dataset.say]); });
  const on = (id, fn) => { const el = $('#'+id); if (el) el.onclick = fn; };
  on('logout', () => {
    if (S.screen==='day' || S.screen==='apt'){ S.screen='home'; S.flow=null; render(); return; }
    shownFund = null;
    Object.assign(S, {screen:'login', name:'', code:'', tier:0, preview:false, flow:null, previewBank:null}); render();
  });
  on('mute', () => { hardStop(); const b = getBank(); b.mute = !b.mute; setBank(b); render(); });
  on('fundchip', () => { S.screen='apt'; S.flow=null; render(); });
  on('promook', () => { S.pendingPromo = null; render(); });
  // login
  const go = () => {
    const n = normName($('#nm').value), t = tierFromCode($('#cd').value);
    if (n.length < 2){ $('#lerr').textContent = 'Type your first name and last initial.'; return; }
    if (!t){ $('#lerr').textContent = 'That code did not work. Check it, or ask Mrs. Groh.'; return; }
    shownFund = null;
    Object.assign(S, {name:n, code:t.code, tier:t.tier, preview:false, screen:'home'}); render();
  };
  on('go', go);
  if ($('#cd')) $('#cd').onkeydown = e => { if (e.key==='Enter') go(); };
  on('toteacher', () => { S.screen='teacher'; render(); });
  // home + apartment
  document.querySelectorAll('[data-week]').forEach(b => b.onclick = () => { S.week = +b.dataset.week; render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => openDay(b.dataset.day));
  on('toapt', () => { S.screen='apt'; S.flow=null; render(); window.scrollTo(0,0); });
  on('aptback', () => { S.screen='home'; render(); });
  document.querySelectorAll('[data-buy]').forEach(btn => btn.onclick = () => {
    const it = ITEMS.find(x => x.id===btn.dataset.buy), b = getBank();
    if (!it || b.owned.includes(it.id) || b.fund < it.price) return;
    b.fund = r2(b.fund - it.price); b.owned.push(it.id); setBank(b); render();
  });
  // flow
  on('next', () => { const f = S.flow; if (f.steps[f.i].kind==='job'){ refreshBuilt(); } f.i = Math.min(f.i+1, f.steps.length-1); saveFlow(); render(); window.scrollTo(0,0); });
  on('prev', () => { const f = S.flow; f.i = Math.max(f.i-1, 0); saveFlow(); render(); window.scrollTo(0,0); });
  on('home2', () => { S.screen='home'; S.flow=null; render(); });
  on('flip', () => { S.flow.cardFlipped = true; render(); });
  document.querySelectorAll('[data-job]').forEach(b => b.onclick = () => {
    const o = jobOffers().find(x => x.id===b.dataset.job); setJob(o); refreshBuilt(); render();
  });
  on('check', () => submitAnswer($('#ans').value));
  if ($('#ans')) $('#ans').onkeydown = e => { if (e.key==='Enter') submitAnswer($('#ans').value); };
  on('hintbtn', () => { const f = S.flow, st = f.steps[f.i]; f.res[st.qi].hint = true; saveFlow(); render(); });
  document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => {
    const f = S.flow, p = f.all[f.steps[f.i].qi]; submitAnswer(p.options[+b.dataset.choice]);
  });
  document.querySelectorAll('[data-callpick]').forEach(b => b.onclick = () => {
    const f = S.flow; f.callRes = f.callRes || {}; f.callRes.pick = +b.dataset.callpick;
    const w = $('#why'); if (w) f.callRes.why = w.value; render();
  });
  on('lockin', lockCall);
  // calculator
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => calcKey(b.dataset.k));
  on('cspeak', () => speak(num(C.disp)));
  on('cuse', () => { const a = $('#ans'); if (a && !a.disabled){ a.value = String(+(+C.disp).toFixed(10)); a.focus(); } closeCalcMobile(); });
  on('calcfab', () => { $('#calc').classList.add('open'); $('#calcclose').style.display='inline'; });
  on('calcclose', closeCalcMobile);
  // teacher
  const tgo = () => { if ($('#tp').value === CONFIG.teacherPasscode){ S.teacherOk = true; render(); } else $('#terr').textContent = 'Nope.'; };
  on('tgo', tgo); if ($('#tp')) $('#tp').onkeydown = e => { if (e.key==='Enter') tgo(); };
  on('tback', () => { S.screen='login'; render(); });
  document.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => {
    const t = +b.dataset.prev; shownFund = null;
    Object.assign(S, {name:'Mrs. Groh', code:CONFIG.codePrefix + CONFIG.codes[t][0], tier:t, preview:true, previewBank:null, screen:'home', week:1}); render();
  });
  on('vgo', () => {
    const t = tierFromCode($('#vc').value);
    if (!t){ $('#vout').innerHTML = '<span class="no">That code is not on any list.</span>'; return; }
    const want = checkCode($('#vn').value, t.code, $('#vd').value, String(parseAns($('#vs').value)));
    const got = $('#vk').value.trim().toUpperCase();
    $('#vout').innerHTML = want===got ? `<span class="ok">✓ Matches. Score is real. (Tier ${t.tier})</span>` : `<span class="no">✗ Does not match. Expected ${want}. Score or name was changed.</span>`;
  });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const txt = SCRIPTS[b.dataset.copy].text;
    try{ await navigator.clipboard.writeText(txt); b.textContent = 'Copied'; }catch(e){ const r = document.createRange(); r.selectNodeContents($('#scr-'+b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected. Press Ctrl+C'; }
  });
}
function closeCalcMobile(){ const c = $('#calc'); if (c) c.classList.remove('open'); const x = $('#calcclose'); if (x) x.style.display='none'; }

render();
</script>
</body>
</html>
